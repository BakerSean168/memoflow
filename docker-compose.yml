# =============================================================================
# MemoFlow 本地基础设施 Docker Compose
# =============================================================================
# 通过 profiles 区分环境，按需启动对应容器：
#
#   开发环境（postgres + redis + powersync）:
#     docker compose --profile dev up -d
#
#   测试环境（仅 postgres，tmpfs 内存模式）:
#     docker compose --profile test up -d
#
# 生产环境请使用独立的 docker-compose.prod.yml。
# =============================================================================

services:
  # ============================================================
  # profile: dev
  # ============================================================

  # 开发数据库 - PostgreSQL 18 + pgvector，持久化存储
  # wal_level=logical 为 PowerSync 实时同步所必需
  postgres-dev:
    profiles: [dev]
    image: pgvector/pgvector:0.8.5-pg18
    container_name: MemoFlow-dev-db
    environment:
      POSTGRES_USER: MemoFlow
      POSTGRES_PASSWORD: MemoFlow123
      POSTGRES_DB: MemoFlow
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-20230}:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - wal_level=logical
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U MemoFlow -d MemoFlow']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 开发 Redis - host-dev 项目端口块 20220-20239
  redis-dev:
    profiles: [dev]
    image: redis:8-alpine
    container_name: MemoFlow-dev-redis
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-20231}:6379'
    volumes:
      - redis-dev-data:/data
    command: redis-server --appendonly yes --requirepass MemoFlow123
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'MemoFlow123', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # PowerSync 实时同步引擎（依赖 postgres-dev）
  powersync-dev:
    profiles: [dev]
    image: journeyapps/powersync-service:1.25.0
    container_name: MemoFlow-dev-powersync
    ports:
      - '127.0.0.1:${POWERSYNC_HOST_PORT:-20222}:8080'
    depends_on:
      postgres-dev:
        condition: service_healthy
    volumes:
      - ./docker/powersync/powersync.yaml:/config/powersync.yaml:ro
      - ./docker/powersync/sync-config.yaml:/config/sync-config.yaml:ro
    command: ['start', '-c', '/config/powersync.yaml']
    environment:
      PS_PORT: 8080
      PS_SOURCE_HOSTNAME: postgres-dev
      PS_SOURCE_PORT: 5432
      PS_SOURCE_DATABASE: MemoFlow
      PS_SOURCE_USERNAME: MemoFlow
      PS_SOURCE_PASSWORD: MemoFlow123
      PS_STORAGE_HOSTNAME: postgres-dev
      PS_STORAGE_PORT: 5432
      PS_STORAGE_DATABASE: MemoFlow
      PS_STORAGE_USERNAME: MemoFlow
      PS_STORAGE_PASSWORD: MemoFlow123
      PS_JWK_N: ${POWERSYNC_PUBLIC_KEY_N:-iPsCAeT3UnpBpzEuLxRxsnj3GCGLp8UQrv5_WGLGR4Q0nw8OX_wmYGb4pGIzcnYsjM_JkmzZZxxtdS_lT6pWcQs9UdZbSxb1XDD_nRjohdrFvFEjGrATte05qm1Aj2VzmJnowh1tBC_QhVpljjQLBhfbQupgB4H-nuD4HKuzCYQ2-lo-zr2zRVQM9MBsuSFgijPHdHdejKqCKje4VIFjz-zxygoUvxtct3Fcloz06wtURLu5qSwHVAKOgwyHz008iSEZdvm7FfK0M931PH8iZKMb_2OIXDgc_vfIcXw5fadGo3qCgb0hFTE5WK3kHYlRxTCKDPCdznsdW_ZwIwXGvQ}
      PS_JWK_E: ${POWERSYNC_PUBLIC_KEY_E:-AQAB}
      PS_JWK_KID: ${POWERSYNC_KEY_ID:-powersync-dev-d90f228f}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http = require('http'); const req = http.get('http://localhost:8080/probes/liveness', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # profile: test
  # ============================================================

  # 测试数据库 - PostgreSQL 18 + pgvector，tmpfs 内存模式，关闭 fsync 提速
  postgres-test:
    profiles: [test]
    image: pgvector/pgvector:0.8.5-pg18
    container_name: ${TEST_DB_CONTAINER:-MemoFlow-test-db}
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-test_user}
      POSTGRES_PASSWORD: ${TEST_DB_PASS:-test_pass}
      POSTGRES_DB: ${TEST_DB_NAME:-memoflow_test}
    ports:
      - '127.0.0.1:${TEST_DB_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql:rw
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${TEST_DB_USER:-test_user} -d ${TEST_DB_NAME:-memoflow_test}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # PowerSync service dedicated to authenticated Desktop/Web sync E2E.
  # It watches postgres-test instead of the unrelated local-docker database.
  powersync-test:
    profiles: [sync-test]
    image: journeyapps/powersync-service:1.25.0
    container_name: ${TEST_POWERSYNC_CONTAINER:-MemoFlow-test-powersync}
    ports:
      - '${TEST_POWERSYNC_PORT:-58082}:8080'
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./docker/powersync/powersync.yaml:/config/powersync.yaml:ro
      - ./docker/powersync/sync-config.yaml:/config/sync-config.yaml:ro
    command: ['start', '-c', '/config/powersync.yaml']
    environment:
      PS_PORT: 8080
      PS_SOURCE_HOSTNAME: postgres-test
      PS_SOURCE_PORT: 5432
      PS_SOURCE_DATABASE: ${TEST_DB_NAME:-memoflow_test}
      PS_SOURCE_USERNAME: ${TEST_DB_USER:-test_user}
      PS_SOURCE_PASSWORD: ${TEST_DB_PASS:-test_pass}
      PS_STORAGE_HOSTNAME: postgres-test
      PS_STORAGE_PORT: 5432
      PS_STORAGE_DATABASE: ${TEST_DB_NAME:-memoflow_test}
      PS_STORAGE_USERNAME: ${TEST_DB_USER:-test_user}
      PS_STORAGE_PASSWORD: ${TEST_DB_PASS:-test_pass}
      PS_JWK_N: ${POWERSYNC_PUBLIC_KEY_N:-iPsCAeT3UnpBpzEuLxRxsnj3GCGLp8UQrv5_WGLGR4Q0nw8OX_wmYGb4pGIzcnYsjM_JkmzZZxxtdS_lT6pWcQs9UdZbSxb1XDD_nRjohdrFvFEjGrATte05qm1Aj2VzmJnowh1tBC_QhVpljjQLBhfbQupgB4H-nuD4HKuzCYQ2-lo-zr2zRVQM9MBsuSFgijPHdHdejKqCKje4VIFjz-zxygoUvxtct3Fcloz06wtURLu5qSwHVAKOgwyHz008iSEZdvm7FfK0M931PH8iZKMb_2OIXDgc_vfIcXw5fadGo3qCgb0hFTE5WK3kHYlRxTCKDPCdznsdW_ZwIwXGvQ}
      PS_JWK_E: ${POWERSYNC_PUBLIC_KEY_E:-AQAB}
      PS_JWK_KID: ${POWERSYNC_KEY_ID:-powersync-dev-d90f228f}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http = require('http'); const req = http.get('http://127.0.0.1:8080/probes/liveness', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

# =============================================================================
# 持久化卷（仅 dev 使用；test 用 tmpfs，不需要卷）
# =============================================================================
volumes:
  postgres-dev-data:
  redis-dev-data:
