<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemoFlow Planner Production Parity Harness</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      :root {
        --background: 0 0% 100%;
        --foreground: 222 47% 11%;
        --border: 214 32% 91%;
        --muted-foreground: 215 16% 47%;
        --primary: 221 83% 53%;
        --primary-foreground: 210 40% 98%;
        --info: 199 89% 48%;
        --success: 142 71% 45%;
        --warning: 38 92% 50%;
      }
      .poc-shell {
        height: 100%;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(220px, 280px) 1fr;
      }
      .poc-controls {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-right: 1px solid #d9dce3;
      }
      .poc-controls button {
        min-height: 36px;
      }
      .poc-controls pre {
        max-height: 250px;
        overflow: auto;
        white-space: pre-wrap;
        font-size: 11px;
      }
      .poc-calendar {
        min-width: 0;
        min-height: 0;
      }
      @media (max-width: 720px) {
        .poc-shell {
          grid-template-columns: 1fr;
        }
        .poc-controls {
          border-right: 0;
          border-bottom: 1px solid #d9dce3;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
