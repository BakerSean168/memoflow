name: Restore main cache
description: Restore everywhere; save successful job snapshots only on main.

inputs:
  path:
    required: true
    description: Cache paths
  key:
    required: true
    description: Immutable cache key
  restore-keys:
    required: false
    default: ''
    description: Compatible fallback prefixes
outputs:
  cache-hit:
    description: Exact cache hit
    value: ${{ steps.main.outputs.cache-hit || steps.read.outputs.cache-hit || 'false' }}
runs:
  using: composite
  steps:
    # actions/cache owns the post-job save, after all caller tasks complete.
    - id: main
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - id: read
      if: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
