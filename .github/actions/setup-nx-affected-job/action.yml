name: Setup Nx Affected Job
description: Prepare a CI job to run Nx affected commands in this workspace.

inputs:
  node-version:
    description: Node.js version to install
    required: true
  setup-python:
    description: Whether to set up Python for a CI lane that explicitly declares the capability
    required: false
    default: 'true'
  setup-uv:
    description: Whether to set up uv for a CI lane that explicitly declares the capability
    required: false
    default: 'true'
  capabilities:
    description: Comma-separated toolchain capabilities for the lane receipt
    required: false
    default: 'node,pnpm'
  cache-variant:
    description: Stable matrix or shard identity (single for non-matrix jobs)
    required: false
    default: 'single'
  enable-nx-cache:
    description: Whether to restore the lockfile-keyed Nx cache
    required: false
    default: 'true'
  consume-delivery-manifest:
    description: Download and validate the manifest produced by Scope Detector
    required: false
    default: 'false'
  lane:
    description: Stable execution lane registered by the CI/CD platform
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Mark workspace setup start
      shell: bash
      run: echo "WORKSPACE_SETUP_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Consume delivery manifest
      if: ${{ inputs.consume-delivery-manifest == 'true' }}
      uses: ./.github/actions/consume-delivery-manifest

    - name: Create lane input contract
      if: ${{ inputs.consume-delivery-manifest == 'true' && inputs.lane != '' }}
      shell: bash
      env:
        DELIVERY_LANE: ${{ inputs.lane }}
        DELIVERY_MANIFEST_PATH: scope/delivery-manifest-v1.json
        LANE_INPUT_OUTPUT: reports/ci-cd-platform/${{ inputs.lane }}-input-v1.json
      run: |
        node ./tools/ci-cd-platform/create-lane-input.mjs \
          --lane "$DELIVERY_LANE" \
          --manifest "$DELIVERY_MANIFEST_PATH" \
          --output "$LANE_INPUT_OUTPUT"
        echo "LANE_INPUT_PATH=$LANE_INPUT_OUTPUT" >> "$GITHUB_ENV"

    - name: Resolve optional toolchain capabilities
      id: capabilities
      shell: bash
      env:
        SETUP_PYTHON_INPUT: ${{ inputs.setup-python }}
        SETUP_UV_INPUT: ${{ inputs.setup-uv }}
        CI_CAPABILITIES: ${{ inputs.capabilities }}
        DELIVERY_MANIFEST_PATH: scope/delivery-manifest-v1.json
      run: |
        python_required=false
        uv_required=false
        if [ "$SETUP_PYTHON_INPUT" = 'true' ] && [[ ",$CI_CAPABILITIES," == *,python,* ]]; then
          python_required=true
        fi
        if [ "$SETUP_UV_INPUT" = 'true' ] && [[ ",$CI_CAPABILITIES," == *,uv,* ]]; then
          uv_required=true
        fi
        echo "python=$python_required" >> "$GITHUB_OUTPUT"
        echo "uv=$uv_required" >> "$GITHUB_OUTPUT"

    - name: Setup Python
      if: ${{ steps.capabilities.outputs.python == 'true' }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: Setup uv
      if: ${{ steps.capabilities.outputs.uv == 'true' }}
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}

    - name: Setup pnpm
      shell: bash
      run: |
        corepack enable
        pnpm --version

    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      id: pnpm-cache
      uses: ./.github/actions/restore-main-cache
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        # Identical content for every job/shard: one shared immutable entry per lockfile.
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

    # Nx 23 defaults its local cache to ~/.nx/<workspace-hash>/cache; pin it to
    # the workspace. Nx also requires its SQLite index to recognize restored results.
    - name: Pin Nx cache directory
      if: ${{ inputs.enable-nx-cache == 'true' }}
      shell: bash
      run: |
        {
          echo "NX_CACHE_DIRECTORY=$GITHUB_WORKSPACE/.nx/cache"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$GITHUB_WORKSPACE/.nx/workspace-data"
          echo "NX_DAEMON=false"
          echo "NX_LEGACY_AFFECTED=false"
        } >> "$GITHUB_ENV"

    - name: Cache Nx task results
      if: ${{ inputs.enable-nx-cache == 'true' }}
      id: nx-cache
      uses: ./.github/actions/restore-main-cache
      with:
        # Keep the index and artifacts from the same snapshot. Exclude graph
        # snapshots, locks and daemon state; all Nx commands finish before save.
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        # One entry per job and matrix variant: different targets need isolated snapshots.
        # A shared key lets whichever job saves first shadow the others.
        key: nx-${{ runner.os }}-${{ github.job }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ runner.arch }}-${{ inputs.cache-variant }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ github.job }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ runner.arch }}-${{ inputs.cache-variant }}-

    - name: Cache Playwright browsers
      if: ${{ contains(inputs.capabilities, 'playwright') }}
      id: playwright-cache
      uses: ./.github/actions/restore-main-cache
      with:
        path: ~/.cache/ms-playwright
        # Browser binaries depend only on the lockfile, not on the shard.
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --reporter=append-only

    - name: Resolve affected range from delivery manifest
      if: ${{ inputs.consume-delivery-manifest == 'true' }}
      shell: bash
      env:
        DELIVERY_MANIFEST_PATH: scope/delivery-manifest-v1.json
      run: |
        set -euo pipefail
        test -f "$DELIVERY_MANIFEST_PATH"
        NX_BASE_VALUE="$(node -p "const m=require('./$DELIVERY_MANIFEST_PATH'); m.base ?? ''")"
        NX_HEAD_VALUE="$(node -p "const m=require('./$DELIVERY_MANIFEST_PATH'); m.head ?? ''")"
        MANIFEST_COMMIT="$(node -p "require('./$DELIVERY_MANIFEST_PATH').commit")"
        if [ -z "$NX_HEAD_VALUE" ]; then
          echo "Delivery manifest must provide head for CI affected execution (commit=$MANIFEST_COMMIT)"
          exit 1
        fi
        if ! git rev-parse --verify "${NX_HEAD_VALUE}^{commit}" >/dev/null 2>&1; then
          echo "Delivery manifest head is not available in the checkout: $NX_HEAD_VALUE"
          exit 1
        fi
        if [ -n "$NX_BASE_VALUE" ] && ! git rev-parse --verify "${NX_BASE_VALUE}^{commit}" >/dev/null 2>&1; then
          echo "Delivery manifest base is not available in the checkout: $NX_BASE_VALUE"
          exit 1
        fi
        if [ -n "$NX_BASE_VALUE" ]; then
          echo "NX_BASE=$NX_BASE_VALUE" >> "$GITHUB_ENV"
        else
          echo "NX_BASE=" >> "$GITHUB_ENV"
        fi
        echo "NX_HEAD=$NX_HEAD_VALUE" >> "$GITHUB_ENV"
        echo "Using manifest range NX_BASE=${NX_BASE_VALUE:-<none>} NX_HEAD=$NX_HEAD_VALUE"

    - name: Derive SHAs for affected
      if: ${{ inputs.consume-delivery-manifest != 'true' }}
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_SHA" ] && git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            NX_BASE_VALUE=$(git merge-base HEAD "$BASE_SHA")
          else
            if git fetch origin "${{ github.base_ref }}" --depth=1; then
              NX_BASE_VALUE=$(git merge-base HEAD "origin/${{ github.base_ref }}")
            elif [ -n "$BASE_SHA" ]; then
              NX_BASE_VALUE="$BASE_SHA"
            else
              NX_BASE_VALUE=$(git rev-parse HEAD~1)
            fi
          fi
        else
          NX_BASE_VALUE="${{ github.event.before }}"
          if [ -z "$NX_BASE_VALUE" ] || [ "$NX_BASE_VALUE" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "$NX_BASE_VALUE^{commit}" >/dev/null 2>&1; then
            echo "Warning: NX_BASE_VALUE ($NX_BASE_VALUE) is empty, zero, or unreachable (e.g. force push). Falling back to HEAD~1"
            NX_BASE_VALUE=$(git rev-parse HEAD~1)
          fi
        fi
        NX_HEAD_VALUE="${{ github.sha }}"
        echo "NX_BASE=$NX_BASE_VALUE" >> "$GITHUB_ENV"
        echo "NX_HEAD=$NX_HEAD_VALUE" >> "$GITHUB_ENV"
        echo "Using NX_BASE=$NX_BASE_VALUE"
        echo "Using NX_HEAD=$NX_HEAD_VALUE"

    - name: Write workspace receipt
      shell: bash
      env:
        CI_CAPABILITIES: ${{ inputs.capabilities }}
        PNPM_CACHE_HIT: ${{ steps.pnpm-cache.outputs.cache-hit || 'false' }}
        NX_CACHE_HIT: ${{ steps.nx-cache.outputs.cache-hit || 'false' }}
        PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit || 'false' }}
        WORKSPACE_RECEIPT_OUTPUT: reports/ci-cd-platform/workspace-receipt.json
      run: |
        echo "WORKSPACE_SETUP_ENDED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
        WORKSPACE_SETUP_ENDED_AT="$(date +%s%3N)" node ./tools/ci-cd-platform/write-workspace-receipt.mjs
