name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main, feat/system-wide-vnext-convergence]

concurrency:
  # PR: group by PR number, new push cancels the old run. main: group by SHA, each merge runs in parallel.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  NODE_VERSION: '24'
  CI: 'true'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  DELIVERY_MANIFEST_PATH: scope/delivery-manifest-v1.json
  NX_LEGACY_AFFECTED: 'false'

jobs:
  # Changes uses depth 2, with exact-SHA hydration when an event base is
  # absent (multi-commit push / shallow merge boundaries). It still uses Nx
  # task-level Affected and produces the same verifiable task receipts.
  # Consumers only need manifest endpoints, but Unit shards retain full
  # history because their CI selector regression test can move among shards.
  scope-detector:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.scope.outputs.build_required }}
      manifest_path: ${{ steps.scope.outputs.manifest_path }}
      manifest_digest: ${{ steps.scope.outputs.manifest_digest }}
      risk: ${{ steps.scope.outputs.risk }}
      lane_governance: ${{ steps.scope.outputs.lane_governance }}
      capability_fmt: ${{ steps.scope.outputs.capability_fmt }}
      capability_component_browser: ${{ steps.scope.outputs.capability_component_browser }}
      capability_contract: ${{ steps.scope.outputs.capability_contract }}
      lane_validate: ${{ steps.scope.outputs.lane_validate }}
      lane_boundary: ${{ steps.scope.outputs.lane_boundary }}
      lane_integration: ${{ steps.scope.outputs.lane_integration }}
      lane_web: ${{ steps.scope.outputs.lane_web }}
      server_matrix: ${{ steps.scope.outputs.server_matrix }}
      visual_matrix: ${{ steps.scope.outputs.visual_matrix }}
      web_matrix: ${{ steps.scope.outputs.web_matrix }}
      web_specs: ${{ steps.scope.outputs.web_specs }}
      web_estimated_total_ms: ${{ steps.scope.outputs.web_estimated_total_ms }}
      lane_coverage: ${{ steps.scope.outputs.lane_coverage }}
      lane_performance: ${{ steps.scope.outputs.lane_performance }}
      unit_1: ${{ steps.scope.outputs.unit_1 }}
      unit_2: ${{ steps.scope.outputs.unit_2 }}
      unit_3: ${{ steps.scope.outputs.unit_3 }}
      has_unit: ${{ steps.scope.outputs.has_unit }}
      has_coverage: ${{ steps.scope.outputs.has_coverage }}
      has_smoke: ${{ steps.scope.outputs.has_smoke }}
      has_integration: ${{ steps.scope.outputs.has_integration }}
      has_boundary: ${{ steps.scope.outputs.has_boundary }}
      has_desktop_boundary: ${{ steps.scope.outputs.has_desktop_boundary }}
      has_perf: ${{ steps.scope.outputs.has_perf }}
      has_web_flow: ${{ steps.scope.outputs.has_web_flow }}
      job_lint: ${{ steps.scope.outputs.job_lint }}
      job_unit_1: ${{ steps.scope.outputs.job_unit_1 }}
      job_unit_2: ${{ steps.scope.outputs.job_unit_2 }}
      job_unit_3: ${{ steps.scope.outputs.job_unit_3 }}
      job_web_unit_1: ${{ steps.scope.outputs.job_web_unit_1 }}
      job_web_unit_2: ${{ steps.scope.outputs.job_web_unit_2 }}
      job_server_unit: ${{ steps.scope.outputs.job_server_unit }}
      job_build: ${{ steps.scope.outputs.job_build }}
      job_verification_children: ${{ steps.scope.outputs.job_verification_children }}
      job_component_browser: ${{ steps.scope.outputs.job_component_browser }}
      job_web_visual: ${{ steps.scope.outputs.job_web_visual }}
      job_contract: ${{ steps.scope.outputs.job_contract }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 2 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'false'
          setup-uv: 'false'
          enable-nx-cache: 'false'
          changes-only: 'true'
      # The standalone planner does not execute a task to register the checkout
      # with Cloud. Register its CI context before resolving recorded inputs.
      - name: Initialize Nx Cloud selection context without Workers
        run: pnpm exec nx-cloud start-ci-run --no-distribution
      - name: Calculate versioned scope once
        id: scope
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NX_HEAD: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_MANIFEST_OUTPUT: scope/delivery-manifest-v1.json
        run: node ./tools/ci-cd-platform/prepare-ci-manifest.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: delivery-manifest-v1
          path: scope/delivery-manifest-v1.json
          retention-days: 90
      - name: Record actual checkout test identity
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-evidence-v1
          path: scope/ci-evidence-v1.json
          if-no-files-found: error
          retention-days: 90

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'true'
          setup-uv: 'true'
      - name: Full workspace lint, format, sync and governance
        run: node ./tools/ci-cd-platform/run-ci-tasks.mjs lint
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  unit-1:
    name: Test (1/3)
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_unit_1 == 'true'
    runs-on: ubuntu-latest
    env: { UNIT_SHARD_ID: unit-1 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'true'
          setup-uv: 'true'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/ci-cd-platform/run-ci-tasks.mjs unit-1
        env: { DELIVERY_LANE: validate }
      - uses: ./.github/actions/publish-lane-evidence
        if: always()
        with: { lane: validate }
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  unit-2:
    name: Test (2/3)
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_unit_2 == 'true'
    runs-on: ubuntu-latest
    env: { UNIT_SHARD_ID: unit-2 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'true'
          setup-uv: 'true'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/ci-cd-platform/run-ci-tasks.mjs unit-2
        env: { DELIVERY_LANE: validate }
      - uses: ./.github/actions/publish-lane-evidence
        if: always()
        with: { lane: validate }
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  unit-3:
    name: Test (3/3)
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_unit_3 == 'true'
    runs-on: ubuntu-latest
    env: { UNIT_SHARD_ID: unit-3 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'true'
          setup-uv: 'true'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/ci-cd-platform/run-ci-tasks.mjs unit-3
        env: { DELIVERY_LANE: validate }
      - uses: ./.github/actions/publish-lane-evidence
        if: always()
        with: { lane: validate }
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  web-unit-1:
    name: Test Web (Unit 1/2)
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_web_unit_1 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'false'
          setup-uv: 'false'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/ci-cd-platform/run-ci-tasks.mjs web-unit-1
        env: { DELIVERY_LANE: validate }
      - uses: ./.github/actions/publish-lane-evidence
        if: always()
        with: { lane: validate }
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  web-unit-2:
    name: Test Web (Unit 2/2)
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_web_unit_2 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'false'
          setup-uv: 'false'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/ci-cd-platform/run-ci-tasks.mjs web-unit-2
        env: { DELIVERY_LANE: validate }
      - uses: ./.github/actions/publish-lane-evidence
        if: always()
        with: { lane: validate }
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  server-unit:
    name: Test Server (Unit)
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_server_unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'false'
          setup-uv: 'false'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/ci-cd-platform/run-ci-tasks.mjs server-unit
        env: { DELIVERY_LANE: validate }
      - uses: ./.github/actions/publish-lane-evidence
        if: always()
        with: { lane: validate }
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  component-browser:
    name: Test Web (Browser)
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_component_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 2 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'false'
          setup-uv: 'false'
          consume-delivery-manifest: 'true'
      - run: pnpm exec playwright install chromium
      # The audited interaction suites resolve workspace imports from source.
      - name: Storybook interaction tests (Vitest Browser Mode)
        run: node ./tools/ci-cd-platform/run-ci-tasks.mjs component-browser
      - name: Upload Storybook interaction evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: storybook-interactions-${{ github.run_attempt }}
          path: test-results/storybook-results.json
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  contract:
    name: Test (Contracts)
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 2 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'false'
          setup-uv: 'false'
          consume-delivery-manifest: 'true'
      - run: node ./tools/ci-cd-platform/run-ci-tasks.mjs contract
        env: { TEST_REPORT_NAME: contract-tests }
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  build:
    name: Build + Typecheck
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The exact mixed-target Nx internal scheduler currently hangs in Nx Cloud
    # after reporting successful builds. Keep the existing local runner and
    # GitHub cache here until its Cloud lifecycle is fixed and reverified.
    env: { NX_NO_CLOUD: 'true' }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 2 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'true'
          setup-uv: 'true'
          lane: validate
          consume-delivery-manifest: 'true'
      - name: Execute selected build and typecheck in one Nx dependency graph
        run: node ./tools/ci-cd-platform/run-ci-tasks.mjs build
        env: { TEST_REPORT_NAME: build, DELIVERY_LANE: validate }
      - name: Create API artifact manifest
        if: ${{ hashFiles('apps/api/dist/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name api --path apps/api/dist --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/api-artifact-manifest.json
      - name: Create Web artifact manifest
        if: ${{ hashFiles('dist/apps/web/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name web --path dist/apps/web --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/web-artifact-manifest.json
      - name: Create Migrator artifact manifest
        if: ${{ hashFiles('apps/migrator/dist/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name migrator --path apps/migrator/dist --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/migrator-artifact-manifest.json
      - name: Create Database artifact manifest
        if: ${{ hashFiles('packages/database/dist/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name database --path packages/database/dist --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/database-artifact-manifest.json
      - name: Create Database runtime artifact manifest
        if: ${{ hashFiles('packages/database/dist/runtime-scripts/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name database-runtime --path packages/database/dist/runtime-scripts --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/database-runtime-artifact-manifest.json
      - name: Create API runtime dependency closure
        if: ${{ hashFiles('apps/api/dist/**') != '' }}
        run: node ./tools/ci-cd-platform/create-runtime-closure.mjs --manifest scope/delivery-manifest-v1.json --output-dir api-runtime-closure --output reports/ci-cd-platform/api-runtime-closure-artifact-manifest.json
      # The Web artifact has no other consumer-side verifier left (browser
      # shards run from source and no longer download it), so the Build job
      # verifies its own Web and Migrator artifacts before upload; the
      # candidate chain re-verifies the uploaded bundle against these
      # manifests and the runtime closure.
      - name: Verify Web and Migrator artifacts
        if: ${{ hashFiles('reports/ci-cd-platform/web-artifact-manifest.json') != '' || hashFiles('reports/ci-cd-platform/migrator-artifact-manifest.json') != '' }}
        shell: bash
        run: |
          digest=$(node -p "require('./scope/delivery-manifest-v1.json').digest")
          test -n "$digest"
          if [ -f reports/ci-cd-platform/web-artifact-manifest.json ]; then node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/web-artifact-manifest.json dist/apps/web "$digest"; fi
          if [ -f reports/ci-cd-platform/migrator-artifact-manifest.json ]; then node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/migrator-artifact-manifest.json apps/migrator/dist "$digest"; fi
      - name: Upload immutable build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-build-artifacts
          path: |
            apps/api/dist
            apps/migrator/dist
            dist/apps/web
            packages/database/dist
            api-runtime-closure
            scope/delivery-manifest-v1.json
            reports/ci-cd-platform/*-artifact-manifest.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: ./.github/actions/publish-lane-evidence
        with: { lane: validate }
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  verification-children:
    name: Test Server (${{ matrix.shard }})
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_verification_children == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope-detector.outputs.server_matrix) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env: { POSTGRES_USER: test_user, POSTGRES_PASSWORD: test_pass, POSTGRES_DB: memoflow_test }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U test_user -d memoflow_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_SERVER_SHARD: ${{ matrix.shard }}
      DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5433/memoflow_test
      JWT_SECRET: test-jwt-secret-not-for-production-use
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 2 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache-variant: server-${{ strategy.job-index }}
          setup-python: 'false'
          setup-uv: 'false'
          consume-delivery-manifest: 'true'
      - name: Prepare database schema once for the Server resource pool
        run: pnpm exec nx run database:prisma-push
      - name: Execute selected API, DB, IPC and Electron Main suites
        run: node ./tools/ci-cd-platform/run-ci-tasks.mjs verification-children
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  web-visual:
    name: Test Web (Visual ${{ matrix.shard }})
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.job_web_visual == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope-detector.outputs.visual_matrix) }}
    env:
      CI_WEB_SHARD: ${{ matrix.shard }}
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 2 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache-variant: visual-${{ strategy.job-index }}
          setup-python: 'false'
          setup-uv: 'false'
          capabilities: node,pnpm,playwright
          lane: web
          consume-delivery-manifest: 'true'
      - run: pnpm exec playwright install chromium
      - name: Provision visual regression fonts
        if: github.event_name != 'pull_request' || strategy.job-index == 0
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Match the Ubuntu Noble CJK fallback used to generate the tracked PNG baselines.
          # Only shards executing visual comparisons need this prerequisite.
          # Avoid the runner mirror list repeatedly retrying an unreachable Azure mirror.
          fonts_sources="$RUNNER_TEMP/visual-fonts.list"
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' > "$fonts_sources"
          apt_options=(
            -o "Dir::Etc::sourcelist=$fonts_sources"
            -o 'Dir::Etc::sourceparts=-'
            -o 'Acquire::Retries=2'
            -o 'Acquire::http::Timeout=30'
            -o 'Acquire::https::Timeout=30'
            -o 'APT::Update::Error-Mode=any'
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends fonts-noto-cjk=1:20230817+repack1-3 fonts-wqy-zenhei=0.9.45-8
          fc-cache -f
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fonts-wqy-zenhei
          font_family=$(fc-match -f '%{family}' 'Inter:lang=zh-cn')
          echo "Visual font preflight: Inter:lang=zh-cn -> $font_family"
          if [[ "$font_family" != 'Noto Sans CJK SC' ]]; then
            echo "::error::Visual baselines require the Noto Sans CJK SC fallback for Chinese text."
            exit 1
          fi
          font_family=$(fc-match -f '%{family[0]}' 'Inter:lang=en:charset=4e00')
          echo "Visual font preflight: Inter:lang=en:charset=4e00 -> $font_family"
          if [[ "$font_family" != 'WenQuanYi Zen Hei' ]]; then
            echo "::error::Visual baselines require the WenQuanYi Zen Hei fallback for CJK glyphs in English text."
            exit 1
          fi
      # Keep the existing algorithms and baselines. PRs exercise wide/light,
      # narrow/dark, long text, every canonical Web surface and Desktop shell.
      # Schedule/dispatch retain the complete existing target, without a grep.
      - name: Product visual representatives (compare only)
        if: github.event_name == 'pull_request' && strategy.job-index == 0
        run: node ./tools/ci-cd-platform/run-ci-tasks.mjs web-visual visual-pr web:e2e:visual-regression
        env:
          VISUAL_PR_GREP: '1280px light$|440px dark$|840px light$|web: |desktop: (shell\.|foundation\.)|#484 (web .*1280px|desktop .*440px)$|UI-9002|post-vNext|preserve the active Task draft \(light\)'
          TEST_REPORT_NAME: web-visual-representatives
          DELIVERY_LANE: web
      - name: Product visual full audit (compare only)
        if: github.event_name != 'pull_request'
        run: node ./tools/ci-cd-platform/run-ci-tasks.mjs web-visual visual-full web:e2e:visual-regression
        env:
          TEST_REPORT_NAME: web-visual-${{ strategy.job-index }}
          DELIVERY_LANE: web
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-visual-${{ strategy.job-index }}-failure
          path: apps/web/test-results/visual-regression
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/publish-task-receipts
        if: always()

  delivery-observation:
    name: Delivery Observation
    needs:
      - scope-detector
      - lint
      - unit-1
      - unit-2
      - unit-3
      - web-unit-1
      - web-unit-2
      - server-unit
      - build
      - verification-children
      - web-visual
      - component-browser
      - contract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          sparse-checkout: tools/ci-cd-platform
      - name: Download delivery manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: delivery-manifest-v1
          path: scope
      - name: Download lane evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: delivery-*-*-*-${{ github.run_id }}
          path: reports/run-evidence
      - name: Download primary task and workspace receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ci-*-receipts-*
          path: reports/run-evidence
      - name: Collect GitHub run metrics
        id: run_metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./tools/ci-cd-platform/collect-github-run-metrics.mjs --github-output >> "$GITHUB_OUTPUT"
      # Coverage measurement is nightly-audit-only; PR/Main CI does not
      # instrument coverage, so no coverage summary is aggregated here.
      - name: Aggregate run summary
        env:
          CI_CHECK_NEEDS: ${{ toJSON(needs) }}
          DELIVERY_RUN_STARTED_AT: ${{ steps.run_metrics.outputs.started_at }}
          DELIVERY_RUNNER_MINUTES: ${{ steps.run_metrics.outputs.runner_minutes }}
        run: node ./tools/ci-cd-platform/observe-run.mjs --manifest scope/delivery-manifest-v1.json --evidence reports/run-evidence --output reports/ci-cd-platform/run-summary-v1.json
      - name: Upload run summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: delivery-run-summary-${{ github.run_id }}
          path: reports/ci-cd-platform/run-summary-v1.json
          if-no-files-found: error
          retention-days: 30

  ci-check:
    name: CI Check
    needs:
      - scope-detector
      - lint
      - unit-1
      - unit-2
      - unit-3
      - web-unit-1
      - web-unit-2
      - server-unit
      - build
      - verification-children
      - web-visual
      - component-browser
      - contract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: tools/ci-cd-platform
      - name: Download delivery manifest
        # A missing manifest is reported by the gate itself (fail closed).
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: delivery-manifest-v1
          path: scope
      - name: Download primary task receipts
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ci-task-receipts-*
          path: reports/ci-tasks
      # Coverage evidence is nightly-audit-only; CI Check does not gate on it.
      - name: Gate on manifest-selected lanes
        env:
          CI_CHECK_NEEDS: ${{ toJSON(needs) }}
        run: node ./tools/ci-cd-platform/ci-check.mjs --manifest scope/delivery-manifest-v1.json
