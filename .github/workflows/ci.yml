name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/system-wide-vnext-convergence]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '24'
  CI: 'true'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  DELIVERY_MANIFEST_PATH: scope/delivery-manifest-v1.json

jobs:
  scope-detector:
    name: Scope Detector
    runs-on: ubuntu-latest
    outputs:
      manifest_path: ${{ steps.scope.outputs.manifest_path }}
      manifest_digest: ${{ steps.scope.outputs.manifest_digest }}
      risk: ${{ steps.scope.outputs.risk }}
      lane_validate: ${{ steps.scope.outputs.lane_validate }}
      lane_boundary: ${{ steps.scope.outputs.lane_boundary }}
      lane_integration: ${{ steps.scope.outputs.lane_integration }}
      lane_web: ${{ steps.scope.outputs.lane_web }}
      lane_coverage: ${{ steps.scope.outputs.lane_coverage }}
      lane_performance: ${{ steps.scope.outputs.lane_performance }}
      has_unit: ${{ steps.scope.outputs.has_unit }}
      has_coverage: ${{ steps.scope.outputs.has_coverage }}
      has_smoke: ${{ steps.scope.outputs.has_smoke }}
      has_integration: ${{ steps.scope.outputs.has_integration }}
      has_boundary: ${{ steps.scope.outputs.has_boundary }}
      has_desktop_boundary: ${{ steps.scope.outputs.has_desktop_boundary }}
      has_perf: ${{ steps.scope.outputs.has_perf }}
      has_web_flow: ${{ steps.scope.outputs.has_web_flow }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with: { node-version: '${{ env.NODE_VERSION }}', setup-python: 'false', setup-uv: 'false' }
      - name: Calculate versioned scope once
        id: scope
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NX_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DELIVERY_MANIFEST_OUTPUT: scope/delivery-manifest-v1.json
        run: node ./tools/ci-cd-platform/generate-delivery-manifest.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: delivery-manifest-v1
          path: scope/delivery-manifest-v1.json
          retention-days: 14

  governance:
    name: Governance
    needs: scope-detector
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'false'
          setup-uv: 'false'
          lane: governance
          consume-delivery-manifest: 'true'
      - run: pnpm exec nx run test-system-v2:test:inventory --outputStyle=static
      - run: node ./tools/test/test-target-governance.mjs --check
      - run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run memoflow:governance-check
        env: { TEST_REPORT_NAME: governance, DELIVERY_LANE: governance }
      - uses: ./.github/actions/publish-lane-evidence
        with: { lane: governance }

  governance-oracle:
    name: Governance Oracle
    needs: [scope-detector, governance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Aggregate Governance child
        env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope-detector.result }}","enabled":["governance"],"children":{"governance":"${{ needs.governance.result }}"}}
        run: node ./tools/test-system-v2/oracle.mjs

  static-analysis:
    name: Static Analysis
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.lane_validate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'true'
          setup-uv: 'true'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx affected -t lint --parallel=3 --exclude=memoflow --outputStyle=static
        env: { TEST_REPORT_NAME: static-analysis, DELIVERY_LANE: validate }
      - uses: ./.github/actions/publish-lane-evidence
        with: { lane: validate }

  unit:
    name: Unit Tests
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.lane_validate == 'true' && needs.scope-detector.outputs.has_unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'true'
          setup-uv: 'true'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx affected -t test --parallel=3 --exclude=memoflow --outputStyle=static
        env: { TEST_REPORT_NAME: unit, DELIVERY_LANE: validate }
      - uses: ./.github/actions/publish-lane-evidence
        with: { lane: validate }

  typecheck:
    name: Typecheck
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.lane_validate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'true'
          setup-uv: 'true'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx affected -t typecheck --parallel=3 --outputStyle=static
        env: { TEST_REPORT_NAME: typecheck, DELIVERY_LANE: validate }
      - uses: ./.github/actions/publish-lane-evidence
        with: { lane: validate }

  build:
    name: Build
    needs: scope-detector
    if: needs.scope-detector.result == 'success' && needs.scope-detector.outputs.lane_validate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'true'
          setup-uv: 'true'
          lane: validate
          consume-delivery-manifest: 'true'
      - run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx affected -t build --parallel=3 --exclude='contracts,utils,ui-core,assets,sync-client' --outputStyle=static
        env: { TEST_REPORT_NAME: build, DELIVERY_LANE: validate }
      - name: Ensure Web flow build inputs exist
        if: needs.scope-detector.outputs.lane_web == 'true'
        run: pnpm exec nx run-many -t build --projects=api,web,database --parallel=2 --outputStyle=static
      - name: Ensure main release build closure exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pnpm exec nx run-many -t build --projects=api,web,migrator,database --parallel=2 --outputStyle=static
          pnpm exec nx run database:runtime-scripts:build --outputStyle=static
      - name: Create API artifact manifest
        if: ${{ hashFiles('apps/api/dist/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name api --path apps/api/dist --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/api-artifact-manifest.json
      - name: Create Web artifact manifest
        if: ${{ hashFiles('dist/apps/web/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name web --path dist/apps/web --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/web-artifact-manifest.json
      - name: Create Migrator artifact manifest
        if: ${{ hashFiles('apps/migrator/dist/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name migrator --path apps/migrator/dist --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/migrator-artifact-manifest.json
      - name: Create Database artifact manifest
        if: ${{ hashFiles('packages/database/dist/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name database --path packages/database/dist --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/database-artifact-manifest.json
      - name: Create Database runtime artifact manifest
        if: ${{ hashFiles('packages/database/dist/runtime-scripts/**') != '' }}
        run: node ./tools/ci-cd-platform/create-artifact-manifest.mjs --name database-runtime --path packages/database/dist/runtime-scripts --manifest scope/delivery-manifest-v1.json --output reports/ci-cd-platform/database-runtime-artifact-manifest.json
      - name: Create API runtime dependency closure
        if: ${{ hashFiles('apps/api/dist/**') != '' }}
        run: node ./tools/ci-cd-platform/create-runtime-closure.mjs --manifest scope/delivery-manifest-v1.json --output-dir api-runtime-closure --output reports/ci-cd-platform/api-runtime-closure-artifact-manifest.json
      - name: Upload immutable build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-build-artifacts
          path: |
            apps/api/dist
            apps/migrator/dist
            dist/apps/web
            packages/database/dist
            api-runtime-closure
            scope/delivery-manifest-v1.json
            reports/ci-cd-platform/*-artifact-manifest.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: ./.github/actions/publish-lane-evidence
        with: { lane: validate }

  validate-oracle:
    name: Validate Oracle
    needs: [scope-detector, static-analysis, unit, typecheck, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Aggregate Validate children
        env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope-detector.result }}","enabled":{"static":"${{ needs.scope-detector.outputs.lane_validate }}","unit":"${{ needs.scope-detector.outputs.lane_validate == 'true' && needs.scope-detector.outputs.has_unit == 'true' && 'true' || 'false' }}","typecheck":"${{ needs.scope-detector.outputs.lane_validate }}","build":"${{ needs.scope-detector.outputs.lane_validate }}"},"children":{"static":"${{ needs.static-analysis.result }}","unit":"${{ needs.unit.result }}","typecheck":"${{ needs.typecheck.result }}","build":"${{ needs.build.result }}"}}
        run: node ./tools/test-system-v2/oracle.mjs

  verification-children:
    name: Verification Children
    needs: scope-detector
    if: >-
      needs.scope-detector.result == 'success' &&
      (needs.scope-detector.outputs.lane_boundary == 'true' ||
       needs.scope-detector.outputs.lane_integration == 'true' ||
       needs.scope-detector.outputs.lane_coverage == 'true' ||
       needs.scope-detector.outputs.lane_performance == 'true')
    runs-on: ubuntu-latest
    outputs:
      boundary: ${{ steps.lane_status.outputs.boundary }}
      integration: ${{ steps.lane_status.outputs.integration }}
      coverage: ${{ steps.lane_status.outputs.coverage }}
      performance: ${{ steps.lane_status.outputs.performance }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env: { POSTGRES_USER: test_user, POSTGRES_PASSWORD: test_pass, POSTGRES_DB: memoflow_test }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U test_user -d memoflow_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5433/memoflow_test
      JWT_SECRET: test-jwt-secret-not-for-production-use
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'false'
          setup-uv: 'false'
          consume-delivery-manifest: 'true'
      - name: Prepare independent lane contracts on the shared runner
        run: >-
          node ./tools/ci-cd-platform/prepare-shared-lanes.mjs
          --lanes boundary,integration,coverage,performance
          --manifest scope/delivery-manifest-v1.json
          --receipt reports/ci-cd-platform/workspace-receipt.json
          --output reports/ci-cd-platform
      - name: Boundary children
        id: boundary
        if: needs.scope-detector.outputs.has_desktop_boundary == 'true'
        continue-on-error: true
        env:
          DELIVERY_LANE: boundary
          LANE_INPUT_PATH: reports/ci-cd-platform/boundary-input-v1.json
        run: |
          status=0
          TEST_REPORT_NAME=boundary-database node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run database:prisma-push || status=$?
          TEST_REPORT_NAME=desktop-ipc node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run desktop:test:ipc || status=$?
          TEST_REPORT_NAME=desktop-main node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run desktop:test:main || status=$?
          if [ "${{ needs.scope-detector.outputs.has_smoke }}" = 'true' ]; then
            TEST_REPORT_NAME=smoke node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx affected -t test:smoke --parallel=2 --outputStyle=static || status=$?
          fi
          exit "$status"
      - name: Boundary smoke-only children
        id: boundary_smoke
        if: needs.scope-detector.outputs.lane_boundary == 'true' && needs.scope-detector.outputs.has_desktop_boundary != 'true'
        continue-on-error: true
        env:
          DELIVERY_LANE: boundary
          LANE_INPUT_PATH: reports/ci-cd-platform/boundary-input-v1.json
        run: |
          status=0
          TEST_REPORT_NAME=boundary-database node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run database:prisma-push || status=$?
          if [ "${{ needs.scope-detector.outputs.has_smoke }}" = 'true' ]; then
            TEST_REPORT_NAME=smoke node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx affected -t test:smoke --parallel=2 --outputStyle=static || status=$?
          fi
          exit "$status"
      - name: Integration children
        id: integration
        if: needs.scope-detector.outputs.lane_integration == 'true'
        continue-on-error: true
        env:
          DELIVERY_LANE: integration
          LANE_INPUT_PATH: reports/ci-cd-platform/integration-input-v1.json
        run: |
          status=0
          TEST_REPORT_NAME=integration-database node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run database:prisma-push || status=$?
          TEST_REPORT_NAME=integration node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx affected -t test:integration --parallel=1 --outputStyle=static || status=$?
          exit "$status"
      - name: Affected coverage
        id: coverage
        if: needs.scope-detector.outputs.lane_coverage == 'true'
        continue-on-error: true
        env:
          DELIVERY_LANE: coverage
          LANE_INPUT_PATH: reports/ci-cd-platform/coverage-input-v1.json
          TEST_REPORT_NAME: coverage
        run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx affected -t test:coverage --parallel=2 --outputStyle=static
      - name: Performance budget
        id: performance
        if: needs.scope-detector.outputs.lane_performance == 'true'
        continue-on-error: true
        env:
          DELIVERY_LANE: performance
          LANE_INPUT_PATH: reports/ci-cd-platform/performance-input-v1.json
          TEST_REPORT_NAME: performance
        run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx affected -t test:perf --parallel=1 --outputStyle=static
      - uses: ./.github/actions/publish-lane-evidence
        if: always() && needs.scope-detector.outputs.lane_boundary == 'true'
        with:
          lane: boundary
          receipt: reports/ci-cd-platform/boundary-workspace-receipt.json
      - uses: ./.github/actions/publish-lane-evidence
        if: always() && needs.scope-detector.outputs.lane_integration == 'true'
        with:
          lane: integration
          receipt: reports/ci-cd-platform/integration-workspace-receipt.json
      - uses: ./.github/actions/publish-lane-evidence
        if: always() && needs.scope-detector.outputs.lane_coverage == 'true'
        with:
          lane: coverage
          receipt: reports/ci-cd-platform/coverage-workspace-receipt.json
      - uses: ./.github/actions/publish-lane-evidence
        if: always() && needs.scope-detector.outputs.lane_performance == 'true'
        with:
          lane: performance
          receipt: reports/ci-cd-platform/performance-workspace-receipt.json
      - name: Expose independent lane status
        id: lane_status
        if: always()
        shell: bash
        run: |
          echo "boundary=${{ needs.scope-detector.outputs.lane_boundary == 'true' && (steps.boundary.outcome == 'success' || steps.boundary_smoke.outcome == 'success') && 'success' || needs.scope-detector.outputs.lane_boundary == 'true' && 'failure' || 'skipped' }}" >> "$GITHUB_OUTPUT"
          echo "integration=${{ needs.scope-detector.outputs.lane_integration == 'true' && steps.integration.outcome == 'success' && 'success' || needs.scope-detector.outputs.lane_integration == 'true' && 'failure' || 'skipped' }}" >> "$GITHUB_OUTPUT"
          echo "coverage=${{ needs.scope-detector.outputs.lane_coverage == 'true' && steps.coverage.outcome == 'success' && 'success' || needs.scope-detector.outputs.lane_coverage == 'true' && 'failure' || 'skipped' }}" >> "$GITHUB_OUTPUT"
          echo "performance=${{ needs.scope-detector.outputs.lane_performance == 'true' && steps.performance.outcome == 'success' && 'success' || needs.scope-detector.outputs.lane_performance == 'true' && 'failure' || 'skipped' }}" >> "$GITHUB_OUTPUT"
      - name: Fail closed when an enabled lane failed
        if: >-
          always() &&
          ((needs.scope-detector.outputs.lane_boundary == 'true' && steps.lane_status.outputs.boundary != 'success') ||
           (needs.scope-detector.outputs.lane_integration == 'true' && steps.lane_status.outputs.integration != 'success') ||
           (needs.scope-detector.outputs.lane_coverage == 'true' && steps.lane_status.outputs.coverage != 'success') ||
           (needs.scope-detector.outputs.lane_performance == 'true' && steps.lane_status.outputs.performance != 'success'))
        run: exit 1

  boundary-oracle:
    name: Boundary Oracle
    needs: [scope-detector, verification-children]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Aggregate Boundary children
        env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope-detector.result }}","enabled":${{ needs.scope-detector.outputs.lane_boundary == 'true' && '["boundary"]' || '[]' }},"children":{"boundary":"${{ needs.verification-children.outputs.boundary || needs.verification-children.result }}"}}
        run: node ./tools/test-system-v2/oracle.mjs

  integration-oracle:
    name: Integration Oracle
    needs: [scope-detector, verification-children]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Aggregate Integration children
        env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope-detector.result }}","enabled":${{ needs.scope-detector.outputs.lane_integration == 'true' && '["integration"]' || '[]' }},"children":{"integration":"${{ needs.verification-children.outputs.integration || needs.verification-children.result }}"}}
        run: node ./tools/test-system-v2/oracle.mjs

  web-flow-shard:
    name: Web Flow Shard (${{ matrix.shard }})
    needs: [scope-detector, build]
    if: needs.scope-detector.result == 'success' && needs.build.result == 'success' && needs.scope-detector.outputs.lane_web == 'true'
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { shard: ['1/4', '2/4', '3/4', '4/4'] } }
    env:
      DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5433/memoflow_test
      JWT_SECRET: test-jwt-secret-for-e2e-testing-purposes
      TZ: UTC
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env: { POSTGRES_USER: test_user, POSTGRES_PASSWORD: test_pass, POSTGRES_DB: memoflow_test }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U test_user -d memoflow_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '${{ env.NODE_VERSION }}'
          setup-python: 'false'
          setup-uv: 'false'
          capabilities: node,pnpm,playwright,postgres
          lane: web
          consume-delivery-manifest: 'true'
      - name: Download immutable build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-build-artifacts
          path: .
      - name: Resolve artifact source manifest digest
        id: artifact-source
        shell: bash
        run: |
          digest=$(node -p "require('./reports/ci-cd-platform/web-input-v1.json').manifestDigest")
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore API runtime dependency closure
        run: node ./tools/ci-cd-platform/restore-runtime-closure.mjs reports/ci-cd-platform/api-runtime-closure-artifact-manifest.json api-runtime-closure . "${{ steps.artifact-source.outputs.digest }}"
      - name: Verify API artifact
        run: node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/api-artifact-manifest.json apps/api/dist "${{ steps.artifact-source.outputs.digest }}"
      - name: Verify Web artifact
        run: node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/web-artifact-manifest.json dist/apps/web "${{ steps.artifact-source.outputs.digest }}"
      - name: Verify Database artifact
        run: node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/database-artifact-manifest.json packages/database/dist "${{ steps.artifact-source.outputs.digest }}"
      - run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run database:prisma-push
        env: { TEST_REPORT_NAME: web-database, DELIVERY_LANE: web }
      - run: pnpm exec playwright install chromium
      # start-api-server.ts builds the API immediately before launching its isolated process.
      - run: node ./tools/test-system-v2/run-command.mjs -- node ./tools/test-system-v2/run-web-shard.mjs ${{ matrix.shard }}
        env:
          TEST_REPORT_NAME: web-flow-${{ strategy.job-index }}
          DELIVERY_LANE: web
          E2E_PREBUILT_ARTIFACT: '1'
      - name: Secure AI Provider product acceptance
        if: matrix.shard == '1/4'
        run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run web:e2e:ai-provider
        env:
          TEST_REPORT_NAME: web-ai-provider
          DELIVERY_LANE: web
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: web-flow-${{ strategy.job-index }}-results
          path: apps/web/test-results/results.json
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-flow-${{ strategy.job-index }}-failure
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/publish-lane-evidence
        with:
          lane: web
          artifact-suffix: shard-${{ strategy.job-index }}

  web-flow-oracle:
    name: Web Flow Oracle
    needs: [scope-detector, web-flow-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Aggregate Web Flow shards
        env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope-detector.result }}","enabled":${{ needs.scope-detector.outputs.lane_web == 'true' && '["web"]' || '[]' }},"children":{"web":"${{ needs.web-flow-shard.result }}"}}
        run: node ./tools/test-system-v2/oracle.mjs

  coverage-oracle:
    name: Coverage Oracle
    needs: [scope-detector, verification-children]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Aggregate Coverage children
        env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope-detector.result }}","enabled":${{ needs.scope-detector.outputs.lane_coverage == 'true' && '["coverage"]' || '[]' }},"children":{"coverage":"${{ needs.verification-children.outputs.coverage || needs.verification-children.result }}"}}
        run: node ./tools/test-system-v2/oracle.mjs

  performance-oracle:
    name: Performance Oracle
    needs: [scope-detector, verification-children]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Aggregate Performance children
        env:
          ORACLE_INPUT: >-
            {"detector":"${{ needs.scope-detector.result }}","enabled":${{ needs.scope-detector.outputs.lane_performance == 'true' && '["performance"]' || '[]' }},"children":{"performance":"${{ needs.verification-children.outputs.performance || needs.verification-children.result }}"}}
        run: node ./tools/test-system-v2/oracle.mjs

  delivery-observation:
    name: Delivery Observation
    needs:
      - scope-detector
      - governance
      - static-analysis
      - unit
      - typecheck
      - build
      - verification-children
      - web-flow-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download delivery manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: delivery-manifest-v1
          path: scope
      - name: Download lane evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: reports/run-evidence
      - name: Collect GitHub run metrics
        id: run_metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./tools/ci-cd-platform/collect-github-run-metrics.mjs --github-output >> "$GITHUB_OUTPUT"
      - name: Aggregate run summary
        env:
          DELIVERY_RUN_STARTED_AT: ${{ steps.run_metrics.outputs.started_at }}
          DELIVERY_RUNNER_MINUTES: ${{ steps.run_metrics.outputs.runner_minutes }}
        run: node ./tools/ci-cd-platform/observe-run.mjs --manifest scope/delivery-manifest-v1.json --evidence reports/run-evidence --output reports/ci-cd-platform/run-summary-v1.json
      - name: Upload run summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: delivery-run-summary-${{ github.run_id }}
          path: reports/ci-cd-platform/run-summary-v1.json
          if-no-files-found: error
          retention-days: 30
