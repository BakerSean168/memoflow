name: Release Assets

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
      macos_signing_mode:
        required: false
        type: string
        default: unsigned-pilot
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build and upload assets for
        required: true
        type: string
      sha:
        description: Exact release SHA; empty resolves from the tag
        required: false
        type: string
      macos_signing_mode:
        description: macOS trust policy for this release
        required: false
        default: unsigned-pilot
        type: choice
        options:
          - unsigned-pilot
          - signed-notarized

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

jobs:
  prepare-release:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      macos_signing_mode: ${{ steps.resolve.outputs.macos_signing_mode }}
    steps:
      - name: Resolve exact tag and SHA
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
          MACOS_SIGNING_MODE: ${{ inputs.macos_signing_mode }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const requestedSha = process.env.RELEASE_SHA;
            const macosSigningMode = process.env.MACOS_SIGNING_MODE || 'unsigned-pilot';
            if (!['unsigned-pilot', 'signed-notarized'].includes(macosSigningMode)) {
              core.setFailed(`unsupported macOS signing mode: ${macosSigningMode}`);
              return;
            }
            if (!tag) {
              core.setFailed('release tag is required');
              return;
            }
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`,
            });
            let tagSha = ref.data.object.sha;
            if (ref.data.object.type === 'tag') {
              const annotated = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: tagSha,
              });
              tagSha = annotated.data.object.sha;
            }
            if (requestedSha && requestedSha !== tagSha) {
              core.setFailed(`${tag} points to ${tagSha}, requested SHA was ${requestedSha}`);
              return;
            }
            core.setOutput('release_tag', tag);
            core.setOutput('release_sha', tagSha);
            core.setOutput('macos_signing_mode', macosSigningMode);

  windows-installed-update-e2e:
    name: Desktop Installed Update Gate
    needs: prepare-release
    uses: ./.github/workflows/desktop-update-e2e.yml
    with:
      ref: ${{ needs.prepare-release.outputs.release_sha }}

  build-release-assets:
    needs: prepare-release
    name: Build ${{ matrix.platform }} Assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            platform_os: windows
            arch: x64
            signing_state: unsigned
            runtime_executable_kind: packaged-exe
            builder_args: --win nsis zip --x64
          - os: ubuntu-latest
            platform: linux-x64
            platform_os: linux
            arch: x64
            signing_state: unsigned
            runtime_executable_kind: installed-deb
            builder_args: --linux AppImage deb rpm --x64
          - os: macos-15-intel
            platform: macos-x64
            platform_os: macos
            arch: x64
            signing_state: macos-policy
            runtime_executable_kind: packaged-app
            builder_args: --mac dmg zip --x64
          - os: macos-15
            platform: macos-arm64
            platform_os: macos
            arch: arm64
            signing_state: macos-policy
            runtime_executable_kind: packaged-app
            builder_args: --mac dmg zip --arm64

    steps:
      - name: Checkout release packaging tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          path: release-source

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: release-source/apps/desktop/.python-version

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x64

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot xvfb dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin

      - name: Install dependencies
        working-directory: release-source
        env:
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Validate release contract
        working-directory: release-source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: node ./tools/ci-cd-platform/release-tools/release-contract.mjs --require-release --expected-tag "$RELEASE_TAG"

      - name: Build desktop application
        working-directory: release-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/release-source/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
        run: pnpm nx run desktop:build:production --outputStyle=static

      - name: Rebuild native dependencies for Electron
        working-directory: release-source
        shell: bash
        run: |
          node ../release-tooling/apps/desktop/scripts/rebuild-native-dependencies.mjs \
            --workspace-root "$PWD" \
            --platform "${{ matrix.platform_os }}" \
            --arch "${{ matrix.arch }}"

      - name: Resolve Desktop signing policy
        id: signing-policy
        working-directory: release-source
        shell: bash
        env:
          MACOS_SIGNING_MODE: ${{ needs.prepare-release.outputs.macos_signing_mode }}
        run: |
          node ../release-tooling/tools/ci-cd-platform/release-tools/macos-signing-policy.mjs \
            resolve \
            "${{ matrix.platform_os }}" \
            "${{ matrix.signing_state }}" \
            "$MACOS_SIGNING_MODE"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const output = await readFile(process.env.GITHUB_OUTPUT, 'utf8');
          if (!/^signing_state=.+$/mu.test(output) || !/^signed_mode=(?:true|false)$/mu.test(output)) {
            throw new Error('Desktop signing policy did not emit explicit signing_state and signed_mode outputs');
          }
          NODE

      - name: Prepare protected macOS signing credentials
        if: steps.signing-policy.outputs.signed_mode == 'true'
        working-directory: release-source
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_APPLE_API_KEY_P8: ${{ secrets.MACOS_APPLE_API_KEY_P8 }}
          MACOS_APPLE_API_KEY_ID: ${{ secrets.MACOS_APPLE_API_KEY_ID }}
          MACOS_APPLE_API_ISSUER: ${{ secrets.MACOS_APPLE_API_ISSUER }}
        run: node ../release-tooling/tools/ci-cd-platform/release-tools/macos-signing-policy.mjs prepare

      - name: Package unsigned/default desktop application
        if: steps.signing-policy.outputs.signed_mode != 'true'
        working-directory: release-source/apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/release-source/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never --config ../../../release-tooling/apps/desktop/electron-builder.json5

      - name: Package signed/notarized macOS application
        if: steps.signing-policy.outputs.signed_mode == 'true'
        working-directory: release-source/apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/release-source/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never --config ../../../release-tooling/apps/desktop/electron-builder.macos-signed.json5

      - name: Notarize and staple signed macOS DMG
        if: steps.signing-policy.outputs.signed_mode == 'true'
        working-directory: release-source/apps/desktop
        shell: bash
        run: >-
          node ../../../release-tooling/tools/ci-cd-platform/release-tools/notarize-macos-dmg.mjs
          dist-package

      - name: Verify packaged Desktop runtime closure
        working-directory: release-source/apps/desktop
        shell: bash
        run: |
          node ./scripts/verify-packaged-runtime-deps.mjs
          if [ "${{ matrix.platform_os }}" = macos ] && [ -f dist-package/latest-mac.yml ]; then
            mv dist-package/latest-mac.yml "dist-package/latest-mac-${{ matrix.arch }}.yml"
          fi

      - name: Verify signed/notarized macOS trust
        if: steps.signing-policy.outputs.signed_mode == 'true'
        working-directory: release-source/apps/desktop
        shell: bash
        run: >-
          node ../../../release-tooling/tools/ci-cd-platform/release-tools/verify-macos-trust.mjs
          dist-package
          "${{ matrix.platform }}"
          "${{ matrix.arch }}"
          "${{ github.workspace }}/release-source/reports/ci-cd-platform/desktop-trust/${{ matrix.platform }}.json"

      - name: Remove temporary macOS notarization key
        if: always() && steps.signing-policy.outputs.signed_mode == 'true'
        shell: bash
        run: |
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f "$APPLE_API_KEY"
          fi

      - name: Resolve packaged Desktop executable
        id: packaged-executable
        working-directory: release-source
        shell: bash
        run: |
          resolver="${{ github.workspace }}/release-tooling/apps/desktop/scripts/resolve-packaged-executable.mjs"
          test -f "$resolver"
          if [ "${{ runner.os }}" = "Linux" ]; then
            shopt -s nullglob
            appimages=(apps/desktop/dist-package/*.AppImage)
            test "${#appimages[@]}" -eq 1
            executable="$(realpath "${appimages[0]}")"
            chmod +x "$executable"
          else
            executable="$(node "$resolver" apps/desktop/dist-package "${{ matrix.platform }}")"
          fi
          test -n "$executable"
          echo "path=$executable" >> "$GITHUB_OUTPUT"

      - name: Run packaged Desktop runtime smoke
        timeout-minutes: 5
        working-directory: release-source
        shell: bash
        env:
          MEMOFLOW_PACKAGED_EXECUTABLE: ${{ steps.packaged-executable.outputs.path }}
          MEMOFLOW_PACKAGED_SMOKE_WORKSPACE_ROOT: ${{ github.workspace }}/release-source
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            export APPIMAGE_EXTRACT_AND_RUN=1
            "${{ github.workspace }}/release-tooling/apps/desktop/scripts/run-linux-packaged-smoke-with-keyring.sh"
          else
            pnpm nx run desktop:test:packaged-smoke --outputStyle=static
          fi

      - name: Upload Desktop runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-runtime-diagnostics-${{ matrix.platform }}
          path: release-source/apps/desktop/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Install Linux Debian package
        if: runner.os == 'Linux'
        working-directory: release-source
        shell: bash
        run: |
          shopt -s nullglob
          debs=(apps/desktop/dist-package/*.deb)
          test "${#debs[@]}" -eq 1
          dpkg-deb -f "${debs[0]}" Package Version Architecture Depends
          deb_path="$(realpath "${debs[0]}")"
          test -f "$deb_path"
          sudo apt-get install -y "$deb_path"
          test -x /opt/MemoFlow/memoflow
          test -f /usr/share/applications/memoflow.desktop
          test -f /opt/MemoFlow/resources/package-type
          test "$(cat /opt/MemoFlow/resources/package-type)" = 'deb'

      - name: Run installed Linux Debian runtime smoke
        timeout-minutes: 5
        if: runner.os == 'Linux'
        working-directory: release-source
        shell: bash
        env:
          MEMOFLOW_PACKAGED_EXECUTABLE: /opt/MemoFlow/memoflow
          MEMOFLOW_PACKAGED_SMOKE_WORKSPACE_ROOT: ${{ github.workspace }}/release-source
        run: '${{ github.workspace }}/release-tooling/apps/desktop/scripts/run-linux-packaged-smoke-with-keyring.sh'

      - name: Write Desktop platform receipt
        working-directory: release-source/apps/desktop
        shell: bash
        run: >-
          node ../../../release-tooling/tools/ci-cd-platform/release-tools/write-desktop-platform-receipt.mjs
          dist-package
          "${{ matrix.platform }}"
          "${{ matrix.platform_os }}"
          "${{ matrix.arch }}"
          "${{ steps.signing-policy.outputs.signing_state }}"
          "${{ needs.prepare-release.outputs.release_tag }}"
          "${{ needs.prepare-release.outputs.release_sha }}"
          "passed"
          "packaged-electron-playwright"
          "${{ matrix.runtime_executable_kind }}"
          "${{ steps.signing-policy.outputs.signed_mode == 'true' && format('{0}/release-source/reports/ci-cd-platform/desktop-trust/{1}.json', github.workspace, matrix.platform) || '' }}"
          "${{ runner.os == 'Linux' && 'packaged-appimage' || '' }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release-source/apps/desktop/dist-package
          if-no-files-found: error
          compression-level: 9

  upload-release-assets:
    name: Upload Draft Release Assets
    needs:
      - prepare-release
      - windows-installed-update-e2e
      - build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: artifacts

      - name: Require an existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"

      - name: Build desktop release evidence
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        shell: bash
        run: |
          node ./tools/ci-cd-platform/release-tools/create-desktop-manifest.mjs artifacts "$RELEASE_TAG" "$RELEASE_SHA" desktop-release-manifest.json
          node ./tools/ci-cd-platform/release-tools/verify-desktop-update-metadata.mjs desktop-release-manifest.json artifacts
          node ./tools/ci-cd-platform/release-tools/materialize-desktop-update-feed.mjs \
            desktop-release-manifest.json artifacts desktop-update-feed stable
          node ./tools/ci-cd-platform/release-tools/materialize-desktop-update-rollout.mjs \
            desktop-update-feed/desktop-update-feed-publication.json desktop-update-feed desktop-update-rollout 10
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('desktop-release-manifest.json', 'utf8'));
          await writeFile('SHA256SUMS.txt', `${manifest.assets.map((asset) => `${asset.sha256}  ${asset.name}`).join('\n')}\n`);
          NODE

      - name: Retain Desktop update feed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-update-feed-evidence
          path: desktop-update-feed
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Retain Desktop update rollout evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-update-rollout-evidence
          path: desktop-update-rollout
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Upload the manifest-owned asset set to the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            node ./tools/ci-cd-platform/release-tools/resolve-desktop-release-assets.mjs \
              desktop-release-manifest.json artifacts
          )
          expected_count="$(jq '.assets | length' desktop-release-manifest.json)"
          [ "${#files[@]}" -eq "$expected_count" ] || {
            echo "resolved ${#files[@]} Desktop assets; manifest requires $expected_count" >&2
            exit 1
          }
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            desktop-release-manifest.json SHA256SUMS.txt --clobber
          release_api_url="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          test -n "$release_api_url"
          gh api "$release_api_url" > github-release-assets.json
          node ./tools/ci-cd-platform/release-tools/verify-desktop-release-assets.mjs \
            desktop-release-manifest.json github-release-assets.json
