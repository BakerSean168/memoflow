name: Quality Runner Shadow

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Stable benchmark workload label
        required: true
        default: desktop-pr286
      affected_base:
        description: Fixed Nx affected base SHA
        required: true
        default: ee8472486377c30ecced3ef1ec07012fd8a06f24
      affected_head:
        description: Fixed Nx affected head SHA
        required: true
        default: ca3970a4c536addfc48409db1c22ebb4e0ce9ae6

permissions:
  contents: read

env:
  DELIVERY_MANIFEST_PATH: reports/quality-shadow/manifest.json
  LANE_INPUT_PATH: reports/quality-shadow/validate-input.json

jobs:
  split:
    name: Shadow Split (${{ matrix.child }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        child: [static, unit-1, unit-2, unit-3, typecheck, build]
    steps:
      - name: Mark physical job start
        run: echo "QUALITY_JOB_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          cache-variant: ${{ matrix.child }}
          node-version: '24'
          setup-python: 'true'
          setup-uv: 'true'
      - name: Pin benchmark affected range
        env:
          BENCHMARK_BASE: ${{ inputs.affected_base }}
          BENCHMARK_HEAD: ${{ inputs.affected_head }}
        run: |
          set -euo pipefail
          git rev-parse --verify "${BENCHMARK_BASE}^{commit}" >/dev/null
          git rev-parse --verify "${BENCHMARK_HEAD}^{commit}" >/dev/null
          echo "NX_BASE=$BENCHMARK_BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$BENCHMARK_HEAD" >> "$GITHUB_ENV"
      - name: Prepare the same selected workload as required CI
        run: |
          GITHUB_EVENT_NAME=pull_request DELIVERY_MANIFEST_OUTPUT="$DELIVERY_MANIFEST_PATH" node ./tools/ci-cd-platform/generate-delivery-manifest.mjs
          node ./tools/ci-cd-platform/create-lane-input.mjs --lane validate --manifest "$DELIVERY_MANIFEST_PATH" --output "$LANE_INPUT_PATH"
      - name: Run split logical child
        id: child
        continue-on-error: true
        env:
          QUALITY_JOB_KEY: split-${{ matrix.child }}
        run: >-
          node ./tools/ci-cd-platform/quality-shadow.mjs run-child
          --profile split
          --child '${{ matrix.child }}'
          --workload '${{ inputs.workload }}'
          --output 'quality-shadow-receipts/split-${{ matrix.child }}.json'
      - name: Upload split receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-shadow-split-${{ matrix.child }}-${{ github.run_id }}
          path: quality-shadow-receipts/split-${{ matrix.child }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve split child result
        if: always() && steps.child.outcome != 'success'
        run: exit 1

  consolidated:
    name: Shadow Consolidated Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Mark physical job start
        run: echo "QUALITY_JOB_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '24'
          setup-python: 'true'
          setup-uv: 'true'
      - name: Pin benchmark affected range
        env:
          BENCHMARK_BASE: ${{ inputs.affected_base }}
          BENCHMARK_HEAD: ${{ inputs.affected_head }}
        run: |
          set -euo pipefail
          git rev-parse --verify "${BENCHMARK_BASE}^{commit}" >/dev/null
          git rev-parse --verify "${BENCHMARK_HEAD}^{commit}" >/dev/null
          echo "NX_BASE=$BENCHMARK_BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$BENCHMARK_HEAD" >> "$GITHUB_ENV"
      - name: Prepare the same selected workload as required CI
        run: |
          GITHUB_EVENT_NAME=pull_request DELIVERY_MANIFEST_OUTPUT="$DELIVERY_MANIFEST_PATH" node ./tools/ci-cd-platform/generate-delivery-manifest.mjs
          node ./tools/ci-cd-platform/create-lane-input.mjs --lane validate --manifest "$DELIVERY_MANIFEST_PATH" --output "$LANE_INPUT_PATH"
      - name: Run all consolidated logical children
        id: children
        continue-on-error: true
        env:
          QUALITY_JOB_KEY: consolidated
        run: |
          status=0
          for child in static unit-1 unit-2 unit-3 typecheck build; do
            node ./tools/ci-cd-platform/quality-shadow.mjs run-child \
              --profile consolidated \
              --child "$child" \
              --workload '${{ inputs.workload }}' \
              --output "quality-shadow-receipts/consolidated-${child}.json" || status=$?
          done
          exit "$status"
      - name: Upload consolidated receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-shadow-consolidated-${{ github.run_id }}
          path: quality-shadow-receipts/consolidated-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve consolidated child result
        if: always() && steps.children.outcome != 'success'
        run: exit 1

  paired-sample:
    name: Quality Shadow Paired Sample
    needs: [split, consolidated]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download paired child receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: quality-shadow-*-${{ github.run_id }}
          path: reports/quality-shadow/evidence
          merge-multiple: true
      - name: Build paired timing sample
        id: sample
        continue-on-error: true
        run: >-
          node ./tools/ci-cd-platform/quality-shadow.mjs build-sample
          --input reports/quality-shadow/evidence
          --output reports/ci-cd-platform/quality-shadow-sample-v1.json
      - name: Upload paired sample
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-runner-shadow-${{ github.run_id }}
          path: reports/ci-cd-platform/quality-shadow-sample-v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce paired success and parity
        if: always()
        env:
          SPLIT_RESULT: ${{ needs.split.result }}
          CONSOLIDATED_RESULT: ${{ needs.consolidated.result }}
          SAMPLE_RESULT: ${{ steps.sample.outcome }}
        run: |
          test "$SPLIT_RESULT" = success
          test "$CONSOLIDATED_RESULT" = success
          test "$SAMPLE_RESULT" = success
