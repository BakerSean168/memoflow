name: Nightly Web Flow Audit

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5433/memoflow_test
  JWT_SECRET: test-jwt-secret-for-e2e-testing-purposes
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  TZ: UTC

jobs:
  audit:
    name: Web Flow Full Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: memoflow_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d memoflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: '24'
          setup-python: 'false'
          setup-uv: 'false'
          capabilities: node,pnpm,playwright,postgres
      - name: Prepare database
        run: pnpm exec nx run database:prisma-push
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Run extended Web Flow audit
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
          DELIVERY_LANE: web
          TEST_REPORT_NAME: web-flow-audit
        run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run web:e2e:audit
      - name: Run secure AI Provider acceptance
        if: ${{ !cancelled() }}
        env:
          DELIVERY_LANE: web
          TEST_REPORT_NAME: web-ai-provider-audit
          E2E_OPENROUTER_API_KEY: ${{ secrets.E2E_OPENROUTER_API_KEY }}
        run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run web:e2e:ai-provider
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-flow-audit-${{ github.run_id }}
          path: |
            apps/web/test-results/audit-results.json
            reports/test-system-v2
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-flow-audit-failure-${{ github.run_id }}
          path: |
            apps/web/test-results
            apps/web/playwright-audit-report
          if-no-files-found: ignore
          retention-days: 7

  notify-failure:
    name: Report nightly audit failure
    needs: audit
    # Scheduled and manual workflow_dispatch audits intentionally report the same outcomes.
    if: ${{ always() && (needs.audit.result == 'failure' || needs.audit.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: nightly-web-flow-audit-alert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: node tools/ci-cd-platform/nightly-audit-failure.mjs
