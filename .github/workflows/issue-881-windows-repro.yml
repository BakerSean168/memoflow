name: Issue 881 historical Windows native crash reproduction

# Ephemeral investigation branch only. Never runs on main, schedules, or PRs.
on:
  push:
    branches:
      - investigation/issue-881-windows-repro-20261122
    paths:
      - .github/workflows/issue-881-windows-repro.yml

permissions:
  contents: read

concurrency:
  group: issue-881-windows-repro
  cancel-in-progress: false

jobs:
  historical-windows-build:
    name: Exact Nightly d21ac88 Windows build (attempt ${{ matrix.attempt }}/8)
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        attempt: [5, 6, 7, 8]
    steps:
      - name: Checkout current diagnosis script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout exact historical Nightly source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d21ac88c03a84623bc9029dbef9fa84ba7ffdc34
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          pnpm --version

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: release-source/apps/desktop/.python-version

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x64

      - name: Install historical dependencies
        working-directory: release-source
        shell: pwsh
        env:
          PYTHON: ${{ env.pythonLocation }}\python.exe
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Install matching Rolldown 1.2.9 PDB
        working-directory: release-source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../tools/ci/prepare-rolldown-debug-symbols.mjs

      - name: Reproduce historical release-assets build without Nx overrides
        working-directory: release-source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: --require=${{ github.workspace }}/release-source/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}\python.exe
          npm_config_python: ${{ env.pythonLocation }}\python.exe
          RUST_BACKTRACE: full
        run: pnpm nx run desktop:build:production --outputStyle=static
