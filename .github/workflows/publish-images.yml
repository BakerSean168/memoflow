name: Publish Docker Images

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to promote images for
        required: true
        type: string
      sha:
        description: Exact release SHA; empty resolves from the tag
        required: false
        type: string
      ci_run_id:
        description: Exact successful main CI run; empty resolves from candidate-set
        required: false
        type: string

concurrency:
  group: publish-images-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  packages: write

env:
  NODE_VERSION: '24'

jobs:
  prepare-release:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Resolve exact tag and SHA
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const requestedSha = process.env.RELEASE_SHA;
            if (!tag) {
              core.setFailed('release tag is required');
              return;
            }
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`,
            });
            let tagSha = ref.data.object.sha;
            if (ref.data.object.type === 'tag') {
              const annotated = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: tagSha,
              });
              tagSha = annotated.data.object.sha;
            }
            if (requestedSha && requestedSha !== tagSha) {
              core.setFailed(`${tag} points to ${tagSha}, requested SHA was ${requestedSha}`);
              return;
            }
            core.setOutput('release_tag', tag);
            core.setOutput('release_sha', tagSha);

  resolve-candidate:
    name: Resolve Exact Server Candidate
    needs: prepare-release
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve successful candidate-set artifact
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            const artifactName = `candidate-set-${sha}`;
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'candidate-publish.yml',
              head_sha: sha,
              status: 'success',
              per_page: 50,
            });
            for (const run of response.data.workflow_runs) {
              if (run.head_sha !== sha || run.conclusion !== 'success') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              if (artifacts.some((artifact) => artifact.name === artifactName && !artifact.expired)) {
                core.setOutput('run_id', String(run.id));
                core.info(`Using candidate-set from run ${run.id} for ${sha}`);
                return;
              }
            }
            core.setFailed(`No successful exact-SHA candidate-set artifact found for ${sha}`);

  promote-candidate:
    name: Promote Candidate Images Without Rebuild
    needs:
      - prepare-release
      - resolve-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate release contract
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: node ./tools/ci-cd-platform/release-tools/release-contract.mjs --require-release --expected-tag "$RELEASE_TAG"

      - name: Download canonical candidate set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-set-${{ needs.prepare-release.outputs.release_sha }}
          path: reports/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-candidate.outputs.run_id }}

      - name: Validate candidate and exact successful main CI identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          EXPECTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=reports/candidate/candidate-set-v1.json
          node ./tools/ci-cd-platform/candidate-manifest.mjs --validate "$manifest"
          test "$(node -p "require('./$manifest').gitSha")" = "$RELEASE_SHA"
          candidate_ci="$(node -p "require('./$manifest').ciRunId")"
          if [[ -n "$EXPECTED_CI_RUN_ID" ]]; then
            test "$candidate_ci" = "$EXPECTED_CI_RUN_ID"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_ci" > reports/candidate/main-ci.json
          test "$(jq -r .head_sha reports/candidate/main-ci.json)" = "$RELEASE_SHA"
          test "$(jq -r .head_branch reports/candidate/main-ci.json)" = 'main'
          test "$(jq -r .event reports/candidate/main-ci.json)" = 'push'
          test "$(jq -r .status reports/candidate/main-ci.json)" = 'completed'
          test "$(jq -r .conclusion reports/candidate/main-ci.json)" = 'success'

      - name: Resolve immutable release tag
        id: tags
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          echo "immutable_tag=${RELEASE_TAG}-${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to ACR with bounded retry
        uses: ./.github/actions/registry-login
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Preflight immutable candidate and release-tag collisions
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_IMMUTABLE_TAG: ${{ steps.tags.outputs.immutable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=reports/candidate/candidate-set-v1.json
          candidate_tag="$(node -p "require('./$manifest').candidateTag")"
          for component in web api migrator; do
            expected="$(node -p "require('./$manifest').images.$component.digest")"
            for distribution in china global; do
              repo="$(node -p "require('./$manifest').images.$component.distributions.$distribution.repository")"
              test "$(docker buildx imagetools inspect "$repo:$candidate_tag" --format '{{.Manifest.Digest}}')" = "$expected"
              for target_tag in "$RELEASE_TAG" "$RELEASE_IMMUTABLE_TAG"; do
                existing="$(docker buildx imagetools inspect "$repo:$target_tag" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
                if [[ -n "$existing" && "$existing" != "$expected" ]]; then
                  echo "$repo:$target_tag already points to $existing, expected $expected" >&2
                  exit 1
                fi
              done
            done
          done

      - name: Carbon-copy candidate digests to release tags
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_IMMUTABLE_TAG: ${{ steps.tags.outputs.immutable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=reports/candidate/candidate-set-v1.json
          for component in web api migrator; do
            expected="$(node -p "require('./$manifest').images.$component.digest")"
            for distribution in china global; do
              repo="$(node -p "require('./$manifest').images.$component.distributions.$distribution.repository")"
              docker buildx imagetools create --prefer-index=false \
                --tag "$repo:$RELEASE_TAG" \
                --tag "$repo:$RELEASE_IMMUTABLE_TAG" \
                "$repo@$expected"
            done
          done

      - name: Verify release tags preserve candidate digests
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_IMMUTABLE_TAG: ${{ steps.tags.outputs.immutable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=reports/candidate/candidate-set-v1.json
          for component in web api migrator; do
            expected="$(node -p "require('./$manifest').images.$component.digest")"
            for distribution in china global; do
              repo="$(node -p "require('./$manifest').images.$component.distributions.$distribution.repository")"
              test "$(docker buildx imagetools inspect "$repo:$RELEASE_TAG" --format '{{.Manifest.Digest}}')" = "$expected"
              test "$(docker buildx imagetools inspect "$repo:$RELEASE_IMMUTABLE_TAG" --format '{{.Manifest.Digest}}')" = "$expected"
            done
          done

      - name: Build candidate-bound Docker release evidence
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_IMMUTABLE_TAG: ${{ steps.tags.outputs.immutable_tag }}
          CANDIDATE_MANIFEST: reports/candidate/candidate-set-v1.json
          OUTPUT_FILE: docker-release-manifest.json
        run: node ./tools/ci-cd-platform/release-tools/create-docker-manifest.mjs

      - name: Upload Server evidence to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = 'true'
          cp reports/candidate/candidate-set-v1.json candidate-set-v1.json
          gh release upload "$RELEASE_TAG" candidate-set-v1.json docker-release-manifest.json --clobber

      - name: Upload promotion provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-promotion-${{ needs.prepare-release.outputs.release_sha }}
          path: |
            reports/candidate/candidate-set-v1.json
            reports/candidate/main-ci.json
            docker-release-manifest.json
          if-no-files-found: ignore
          retention-days: 90
