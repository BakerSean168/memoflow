name: Desktop Update Installed E2E

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source ref/SHA to validate
        required: true
        type: string
      qa_overlay_ref:
        description: Optional newer workflow SHA providing test-only QA tooling; product checkout remains immutable
        required: false
        type: string
        default: ''
      recovery_platform:
        description: Select only the failed installed-update gate without repackaging a successful platform
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref/SHA to validate; defaults to the workflow commit
        required: false
        type: string
      qa_overlay_ref:
        description: Newer immutable QA workflow SHA to overlay tests only (never product source)
        required: false
        type: string
      recovery_platform:
        description: Run just a failed platform updater gate, default all
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - linux

permissions:
  contents: read

concurrency:
  group: desktop-update-e2e-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

jobs:
  windows-installed-update:
    name: Windows NSIS N to N+1
    if: inputs.recovery_platform != 'linux'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact update source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          pnpm --version

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: apps/desktop/.python-version

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x64

      - name: Install dependencies
        shell: pwsh
        env:
          PYTHON: ${{ env.pythonLocation }}\python.exe
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build Desktop application
        shell: pwsh
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}\tools\ci\node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}\python.exe
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: pnpm nx run desktop:build:production --outputStyle=static

      - name: Rebuild native dependencies for Electron
        shell: pwsh
        run: >-
          node apps/desktop/scripts/rebuild-native-dependencies.mjs
          --workspace-root "${{ github.workspace }}"
          --platform windows
          --arch x64

      - name: Package synthetic N and current N+1 NSIS fixtures
        id: fixtures
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --require=${{ github.workspace }}\tools\ci\node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}\python.exe
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $packagePath = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\package.json'
          $originalText = Get-Content -LiteralPath $packagePath -Raw
          $original = $originalText | ConvertFrom-Json
          $match = [regex]::Match($original.version, '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$')
          if (-not $match.Success) {
            throw "installed updater E2E requires a stable x.y.z Desktop version: $($original.version)"
          }

          $major = [int]$match.Groups['major'].Value
          $minor = [int]$match.Groups['minor'].Value
          $patch = [int]$match.Groups['patch'].Value
          $candidateVersion = $original.version
          if ($patch -gt 0) {
            $baseVersion = "$major.$minor.$($patch - 1)"
          }
          elseif ($minor -gt 0) {
            $baseVersion = "$major.$($minor - 1).999"
          }
          elseif ($major -gt 0) {
            $baseVersion = "$($major - 1).999.999"
          }
          else {
            throw 'cannot synthesize a lower Desktop version from 0.0.0'
          }

          "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
          "candidate_version=$candidateVersion" >> $env:GITHUB_OUTPUT

          $fixturesRoot = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\update-e2e-fixtures'
          $baseDir = Join-Path $fixturesRoot 'base'
          $candidateDir = Join-Path $fixturesRoot 'candidate'
          Remove-Item -LiteralPath $fixturesRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $baseDir, $candidateDir | Out-Null

          function Set-DesktopVersion([string]$version) {
            $package = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
            $package.version = $version
            $package | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $packagePath -Encoding utf8
          }

          function Package-Fixture([string]$version, [string]$destination) {
            Write-Host "[update-e2e] Packaging MemoFlow $version"
            Set-DesktopVersion $version
            $dist = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\dist-package'
            Remove-Item -LiteralPath $dist -Recurse -Force -ErrorAction SilentlyContinue

            Push-Location (Join-Path $env:GITHUB_WORKSPACE 'apps\desktop')
            try {
              pnpm exec electron-builder --win nsis --x64 --publish never --config electron-builder.json5
              if ($LASTEXITCODE -ne 0) {
                throw "electron-builder failed for version $version with exit code $LASTEXITCODE"
              }
            }
            finally {
              Pop-Location
            }

            Copy-Item -Path (Join-Path $dist '*') -Destination $destination -Recurse -Force
          }

          try {
            Package-Fixture $baseVersion $baseDir
            Package-Fixture $candidateVersion $candidateDir
          }
          finally {
            [System.IO.File]::WriteAllText($packagePath, $originalText)
          }

          $baseInstallers = @(Get-ChildItem -LiteralPath $baseDir -Filter '*Setup.exe' -File)
          $candidateInstallers = @(Get-ChildItem -LiteralPath $candidateDir -Filter '*Setup.exe' -File)
          if ($baseInstallers.Count -ne 1) {
            throw "base fixture must contain exactly one Setup.exe; found $($baseInstallers.Count)"
          }
          if ($candidateInstallers.Count -ne 1) {
            throw "candidate fixture must contain exactly one Setup.exe; found $($candidateInstallers.Count)"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $candidateDir 'latest.yml'))) {
            throw 'candidate fixture is missing latest.yml'
          }

          "base_installer=$($baseInstallers[0].FullName)" >> $env:GITHUB_OUTPUT
          "candidate_feed_dir=$candidateDir" >> $env:GITHUB_OUTPUT

      - name: Run Windows packaged runtime smoke
        shell: pwsh
        env:
          MEMOFLOW_PACKAGED_EXECUTABLE: ${{ steps.fixtures.outputs.candidate_feed_dir }}\win-unpacked\memoflow.exe
        run: pnpm nx run desktop:test:packaged-smoke --outputStyle=static

      - name: Upload Windows packaged runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-packaged-runtime-windows
          path: apps/desktop/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Overlay only acceptance scripts from newer QA tooling
        if: inputs.qa_overlay_ref != ''
        shell: pwsh
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.ref }}
          QA_OVERLAY_SHA: ${{ inputs.qa_overlay_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Do not checkout a second monorepo inside the workspace: Nx would
          # index every duplicate project and reject the exact-source build.
          git fetch --no-tags origin $env:QA_OVERLAY_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch pinned QA-only commit' }
          $resolved = (git rev-parse FETCH_HEAD).Trim()
          if ($resolved -ne $env:QA_OVERLAY_SHA) { throw 'QA commit identity mismatch' }
          # Fail closed if QA-only commit differs in any release product input.
          $runtimeDiff = @(git diff --name-only $env:RELEASE_SOURCE_SHA $env:QA_OVERLAY_SHA -- apps/desktop/src apps/desktop/package.json apps/desktop/electron-builder.json5 apps/desktop/electron-builder.macos-signed.json5 package.json pnpm-lock.yaml packages apps/api apps/web)
          if ($LASTEXITCODE -ne 0 -or $runtimeDiff.Count -gt 0) {
            throw "QA overlay source must not modify released application inputs: $($runtimeDiff -join ', ')"
          }
          $qaFiles = @(
            'apps/desktop/scripts/run-windows-update-e2e.ps1'
            'apps/desktop/e2e/workspace-ipc.spec.mts'
            'apps/desktop/e2e/workspace-attention.spec.mts'
            'apps/desktop/e2e/antigravity-composer.spec.mts'
            'apps/desktop/e2e/native-codex-unconfigured-installed.spec.mts'
            'apps/desktop/e2e/support/installed-native-provenance.ts'
          )
          foreach ($relativePath in $qaFiles) {
            $revisionPath = '{0}:{1}' -f $env:QA_OVERLAY_SHA, $relativePath
            git cat-file -e $revisionPath
            if ($LASTEXITCODE -ne 0) { throw "QA-only source missing: $relativePath" }
            $destination = Join-Path $env:GITHUB_WORKSPACE $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            git show $revisionPath | Set-Content -LiteralPath $destination -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "Unable to materialize QA-only source: $relativePath" }
          }
          Write-Host '[release] Pinned QA-only scripts fetched with git show; no second workspace or product changes.'

      - name: Run installed Windows updater proof
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\update-e2e-evidence'
          $runtimeRoot = Join-Path $evidenceRoot 'runtime'
          $reportPath = Join-Path $evidenceRoot 'desktop-update-installed-e2e.json'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null

          & "${{ github.workspace }}\apps\desktop\scripts\run-windows-update-e2e.ps1" `
            -BaseInstaller "${{ steps.fixtures.outputs.base_installer }}" `
            -CandidateFeedDir "${{ steps.fixtures.outputs.candidate_feed_dir }}" `
            -ExpectedVersion "${{ steps.fixtures.outputs.candidate_version }}" `
            -ReportPath $reportPath `
            -RuntimeRoot $runtimeRoot `
            -TimeoutSeconds 300

          # The PowerShell harness reports failure by throwing. $LASTEXITCODE is
          # reserved for native programs and can be $null after a successful
          # .ps1 invocation, which would turn a real PASS into a false failure.

          Copy-Item `
            -LiteralPath (Join-Path "${{ steps.fixtures.outputs.candidate_feed_dir }}" 'latest.yml') `
            -Destination (Join-Path $evidenceRoot 'latest.yml') `
            -Force

      - name: Verify installed updater evidence
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\update-e2e-evidence\desktop-update-installed-e2e.json'
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json

          if ($report.kind -ne 'desktop-update-installed-e2e') {
            throw "unexpected update E2E evidence kind: $($report.kind)"
          }
          if ($report.result -ne 'passed') {
            throw "Desktop Update E2E did not pass: $($report.result)"
          }
          if ($report.expectedVersion -ne "${{ steps.fixtures.outputs.candidate_version }}") {
            throw "Desktop Update E2E candidate version mismatch"
          }
          if ($report.finalStatus.phase -ne 'candidate-verified') {
            throw "Desktop Update E2E final phase is not candidate-verified"
          }
          if (-not $report.receiptCleared) {
            throw "Desktop Update E2E receipt was not cleared"
          }
          if ($report.installedExecutableSha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Installed candidate did not carry a valid SHA256 receipt'
          }
          if ((Get-FileHash -LiteralPath $report.installedExecutable -Algorithm SHA256).Hash.ToLowerInvariant() -ne $report.installedExecutableSha256) {
            throw 'Installed executable hash differs from the completed update proof'
          }
          if ($report.profileRegistrySemanticSha256Before -ne $report.profileRegistrySemanticSha256After) {
            throw "Profile registry semantic identity drifted across update"
          }
          if ($report.preservationSentinelSha256Before -ne $report.preservationSentinelSha256After) {
            throw "userData preservation sentinel drifted across update"
          }

      # Once the installed-updater proof and both hashes are verified, retain a
      # short-lived diagnostic-only copy of this exact unsigned candidate.
      # Native Provider/UI acceptance remains a separate required gate below.
      - name: Verify retained unsigned Windows QA installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content -LiteralPath 'apps/desktop/update-e2e-evidence/desktop-update-installed-e2e.json' -Raw | ConvertFrom-Json
          $candidateDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/update-e2e-fixtures/candidate'
          $installer = Join-Path $candidateDir $report.candidate.installer
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'Exact candidate installer from updater receipt is missing'
          }
          $sha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $report.candidate.installerSha256) {
            throw 'Retained installer differs from successful installed-updater proof'
          }
          Write-Host '[qa-only] Unsigned candidate matches updater proof; not a Release asset.'

      # This artifact intentionally makes no claim about passing the full UI
      # acceptance suite. It is only for isolated, read-only diagnosis.
      - name: Upload unsigned Windows sync diagnostic installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-unsigned-windows-sync-diagnostic
          path: apps/desktop/update-e2e-fixtures/candidate/*Setup.exe
          if-no-files-found: error
          retention-days: 3

      - name: Run one installed Windows Workspace and Native acceptance suite
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content -LiteralPath 'update-e2e-evidence/desktop-update-installed-e2e.json' -Raw | ConvertFrom-Json
          if ($report.result -ne 'passed' -or -not (Test-Path -LiteralPath $report.installedExecutable)) {
            throw 'An independently verified installed executable is required'
          }
          $env:MEMOFLOW_PACKAGED_EXECUTABLE = $report.installedExecutable
          $env:MEMOFLOW_QA_EXPECTED_EXE_SHA256 = $report.installedExecutableSha256
          $env:MEMOFLOW_QA_EXPECTED_VERSION = $report.expectedVersion
          # One independent installed-executable receipt covers Workspace IPC,
          # Goal/Conversation events, the actual Goal Vue owner panel and local
          # save/reopen via a test-only IPC command adapter, six synthetic Native
          # ACP Attention failures, AGY Composer/history, and empty Codex Home.
          # No real accounts, model turns or billing.
          # Live-account and paid DSH/AGY Send remain separate operator-gated runs.
          pnpm exec playwright test e2e/workspace-ipc.spec.mts e2e/workspace-attention.spec.mts e2e/antigravity-composer.spec.mts e2e/native-codex-unconfigured-installed.spec.mts e2e/native-goal-panel-installed.spec.mts --config playwright.config.ts --workers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Retain the already-tested installer for separately authorized local
      # account/Provider acceptance; never rebuild solely to retrieve this binary.
      # The installer must not be treated as signed, published or production-ready.
      - name: Upload exact unsigned Windows operator QA installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-unsigned-windows-operator-qa
          path: apps/desktop/update-e2e-fixtures/candidate/*Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload installed Windows Workspace and Native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-workspace-ipc-windows
          path: apps/desktop/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installed Windows Native Composer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-installed-native-composer-windows
          path: apps/desktop/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installed updater evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-update-installed-e2e-windows
          path: apps/desktop/update-e2e-evidence
          if-no-files-found: warn
          retention-days: 14

  linux-appimage-update:
    name: Linux AppImage N to N+1
    if: inputs.recovery_platform != 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact update source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: apps/desktop/.python-version

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin libgtk-3-0t64 libnss3 libasound2t64
          # Extracted AppImages cannot use the SUID sandbox. On Ubuntu runners
          # that expose AppArmor's userns restriction, permit Chromium's user
          # namespace sandbox for both N and the updater's argument-free N+1.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install dependencies
        env:
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build Desktop application
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
        run: pnpm nx run desktop:build:production --outputStyle=static

      - name: Rebuild native dependencies for Electron
        run: >-
          node apps/desktop/scripts/rebuild-native-dependencies.mjs
          --workspace-root "${{ github.workspace }}" --platform linux --arch x64

      - name: Package synthetic N and current N+1 AppImage fixtures
        id: fixtures
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdir, rm, cp, readdir } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';
          const packagePath = path.resolve('apps/desktop/package.json');
          const originalText = await readFile(packagePath, 'utf8');
          const original = JSON.parse(originalText);
          if (!/^\d+\.\d+\.\d+$/u.test(original.version)) throw new Error('AppImage E2E requires stable x.y.z');
          const [major, minor, patch] = original.version.split('.').map(Number);
          const baseVersion = patch > 0 ? `${major}.${minor}.${patch - 1}`
            : minor > 0 ? `${major}.${minor - 1}.999`
            : major > 0 ? `${major - 1}.999.999` : null;
          if (!baseVersion) throw new Error('cannot synthesize lower version from 0.0.0');
          const fixturesRoot = path.resolve('apps/desktop/update-e2e-fixtures');
          const dist = path.resolve('apps/desktop/dist-package');
          await rm(fixturesRoot, { recursive: true, force: true });
          try {
            for (const [lane, version] of [['base', baseVersion], ['candidate', original.version]]) {
              await writeFile(packagePath, `${JSON.stringify({ ...original, version }, null, 2)}\n`);
              await rm(dist, { recursive: true, force: true });
              const result = spawnSync('pnpm', ['exec', 'electron-builder', '--linux', 'AppImage', '--x64',
                '--publish', 'never', '--config', 'electron-builder.json5'], {
                cwd: path.dirname(packagePath), env: process.env, stdio: 'inherit', timeout: 600_000,
              });
              if (result.error || result.status !== 0) throw result.error ?? new Error(`AppImage build failed: ${result.status}`);
              const destination = path.join(fixturesRoot, lane);
              await mkdir(destination, { recursive: true });
              const entries = await readdir(dist, { withFileTypes: true });
              const images = entries.filter((entry) => entry.isFile() && entry.name.endsWith('.AppImage'));
              if (images.length !== 1) throw new Error(`${lane} must contain exactly one AppImage`);
              await cp(path.join(dist, images[0].name), path.join(destination, images[0].name));
              if (lane === 'base') {
                await writeFile(process.env.GITHUB_OUTPUT, `base_appimage=${path.join(destination, images[0].name)}\n`, { flag: 'a' });
              } else {
                await cp(path.join(dist, 'latest-linux.yml'), path.join(destination, 'latest-linux.yml'));
              }
            }
          } finally {
            await writeFile(packagePath, originalText);
          }
          await writeFile(process.env.GITHUB_OUTPUT,
            `candidate_version=${original.version}\ncandidate_feed_dir=${path.join(fixturesRoot, 'candidate')}\n`, { flag: 'a' });
          NODE

      - name: Run Linux AppImage updater proof with local HTTP feed
        timeout-minutes: 7
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          MEMOFLOW_PACKAGED_EXECUTABLE: ${{ steps.fixtures.outputs.base_appimage }}
          MEMOFLOW_CI_KEYRING_TIMEOUT_SECONDS: '390'
          MEMOFLOW_LINUX_APPIMAGE_UPDATE_E2E_BASE: ${{ steps.fixtures.outputs.base_appimage }}
          MEMOFLOW_LINUX_APPIMAGE_UPDATE_E2E_FEED: ${{ steps.fixtures.outputs.candidate_feed_dir }}
          MEMOFLOW_LINUX_APPIMAGE_UPDATE_E2E_VERSION: ${{ steps.fixtures.outputs.candidate_version }}
          MEMOFLOW_LINUX_APPIMAGE_UPDATE_E2E_REPORT: ${{ github.workspace }}/apps/desktop/update-e2e-evidence/desktop-update-installed-e2e.json
          MEMOFLOW_LINUX_APPIMAGE_UPDATE_E2E_RUNTIME: ${{ github.workspace }}/apps/desktop/update-e2e-evidence/runtime
        run: |
          mkdir -p apps/desktop/update-e2e-evidence
          apps/desktop/scripts/run-linux-packaged-smoke-with-keyring.sh

      - name: Verify Linux AppImage updater evidence
        env:
          EXPECTED_VERSION: ${{ steps.fixtures.outputs.candidate_version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('apps/desktop/update-e2e-evidence/desktop-update-installed-e2e.json', 'utf8'));
          assert.equal(report.kind, 'desktop-update-installed-e2e');
          assert.equal(report.schemaVersion, 1);
          assert.equal(report.platform, 'linux-appimage');
          assert.equal(report.result, 'passed');
          assert.equal(report.expectedVersion, process.env.EXPECTED_VERSION);
          assert.equal(report.finalStatus.phase, 'candidate-verified');
          assert.equal(report.finalStatus.currentVersion, process.env.EXPECTED_VERSION);
          assert.equal(report.receiptCleared, true);
          assert.equal(report.installedSha256, report.candidate.appImageSha256);
          assert.notEqual(report.baseAppImage.sha256, report.installedSha256);
          assert.equal(report.profileRegistrySemanticSha256Before, report.profileRegistrySemanticSha256After);
          assert.equal(report.preservationSentinelSha256Before, report.preservationSentinelSha256After);
          NODE

      - name: Upload Linux AppImage updater evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-update-installed-e2e-linux-appimage
          path: apps/desktop/update-e2e-evidence
          if-no-files-found: warn
          retention-days: 14
