name: Mirror Runtime Images

on:
  push:
    branches: [main]
    paths:
      - tools/ci-cd-platform/runtime-image-mirrors.json
      - .github/workflows/mirror-runtime-images.yml
      - tools/ci-cd-platform/curate-oci-index.mjs
      - tools/ci-cd-platform/verify-oci-platforms.mjs
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-runtime-images
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror pinned runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Login to ACR
        uses: ./.github/actions/docker-registry-login-retry
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install registry copy tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Mirror exact manifests and verify digest parity
        env:
          CHINA_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          CHINA_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          GLOBAL_NAMESPACE="${GITHUB_REPOSITORY_OWNER,,}"
          AUTH_FILE="$HOME/.docker/config.json"

          manifest_digest() {
            local raw_file error_file status error_text
            raw_file="$(mktemp)"
            error_file="$(mktemp)"
            if skopeo inspect --raw --authfile "$AUTH_FILE" "docker://$1" >"$raw_file" 2>"$error_file"; then
              if [[ ! -s "$raw_file" ]]; then
                rm -f -- "$raw_file" "$error_file"
                echo '::error::Registry returned an empty manifest' >&2
                return 1
              fi
              status=0
              sha256sum "$raw_file" | awk '{print "sha256:" $1}' || status=$?
            else
              status=$?
              error_text="$(cat "$error_file")"
              # Only explicit registry absence permits creation. Auth, network and
              # partial-response failures must not authorize an immutable-tag write.
              if [[ "${2:-false}" == true ]]; then
                case "${error_text,,}" in
                  *'manifest unknown'*|*'manifest_unknown'*|*'name unknown'*|*'name_unknown'*|*'statuscode: 404'*)
                    rm -f -- "$raw_file" "$error_file"
                    return 0
                    ;;
                esac
              fi
              cat "$error_file" >&2
              rm -f -- "$raw_file" "$error_file"
              return "$status"
            fi
            rm -f -- "$raw_file" "$error_file"
            return "$status"
          }

          while IFS=$'\t' read -r name source tag platforms curated_digest; do
            test -n "$name"
            test -n "$source"
            test -n "$tag"
            test "$platforms" = "linux/amd64,linux/arm64"
            upstream_digest="${source##*@}"
            source_raw="$(skopeo inspect --raw --authfile "$AUTH_FILE" "docker://$source")"
            printf '%s' "$source_raw" | node ./tools/ci-cd-platform/verify-oci-platforms.mjs
            source_digest="$(manifest_digest "$source")"
            test "$source_digest" = "$upstream_digest"
            china_ref="$CHINA_REGISTRY/$CHINA_NAMESPACE/$name:$tag"
            global_ref="ghcr.io/$GLOBAL_NAMESPACE/$name:$tag"
            expected_digest="$upstream_digest"
            if [[ "$curated_digest" != "-" ]]; then
              test "$(printf '%s' "$source_raw" | node ./tools/ci-cd-platform/curate-oci-index.mjs)" = "$curated_digest"
              expected_digest="$curated_digest"
            fi
            expected_prefix="${expected_digest#sha256:}"
            test "${tag##*-}" = "${expected_prefix:0:12}"
            china_existing="$(manifest_digest "$china_ref" true)"
            global_existing="$(manifest_digest "$global_ref" true)"
            if [[ "$china_existing" == "$expected_digest" && "$global_existing" == "$expected_digest" ]]; then
              echo "$name: immutable mirror already matches both registries"
            else
              if [[ -n "$china_existing" && "$china_existing" != "$expected_digest" ]] ||
                 [[ -n "$global_existing" && "$global_existing" != "$expected_digest" ]]; then
                echo "::error::Immutable mirror tag digest drifted: $name" >&2
                exit 1
              fi
              if [[ "$curated_digest" == "-" ]]; then
                skopeo copy --all --preserve-digests --authfile "$AUTH_FILE" \
                  "docker://$source" "docker://$china_ref"
                skopeo copy --all --preserve-digests --authfile "$AUTH_FILE" \
                  "docker://$source" "docker://$global_ref"
              else
                # Copy the exact pinned children into a local OCI layout, then
                # publish deterministic index bytes without referrer discovery.
                layout="$(mktemp -d)"
                skopeo copy --all --preserve-digests --authfile "$AUTH_FILE" \
                  "docker://$source" "oci:$layout:upstream"
                test "$(printf '%s' "$source_raw" | node ./tools/ci-cd-platform/curate-oci-index.mjs --layout "$layout")" = "$curated_digest"
                skopeo copy --all --preserve-digests --authfile "$AUTH_FILE" \
                  "oci:$layout:curated" "docker://$china_ref"
                skopeo copy --all --preserve-digests --authfile "$AUTH_FILE" \
                  "oci:$layout:curated" "docker://$global_ref"
                rm -rf -- "$layout"
              fi
            fi

            china_digest="$(manifest_digest "$china_ref")"
            global_digest="$(manifest_digest "$global_ref")"
            test "$china_digest" = "$expected_digest"
            test "$global_digest" = "$expected_digest"
            for ref in "$china_ref" "$global_ref"; do
              skopeo inspect --raw --authfile "$AUTH_FILE" "docker://$ref" \
                | node ./tools/ci-cd-platform/verify-oci-platforms.mjs
            done
            echo "$name: $expected_digest (upstream=$upstream_digest)" >> "$GITHUB_STEP_SUMMARY"
          done < <(
            node -e "const c=require('./tools/ci-cd-platform/runtime-image-mirrors.json'); for (const i of c.images) console.log([i.name,i.source,i.tag,i.platforms.join(','),i.mirrorDigest || '-'].join('\\t'))"
          )
