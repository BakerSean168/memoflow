name: Nx Ultracache recording (manual)

# Ultracache needs real file reads from Cloud Workers. This deliberately never
# runs on PRs, pushes, or a schedule; normal CI stays on GitHub-hosted runners.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nx-ultracache-recording
  cancel-in-progress: false

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_TUI: 'false'
  NX_LEGACY_AFFECTED: 'false'
  # Resource packing failed on the Hobby workspace without a Valkey index.
  # Standard Nx Cloud Workers distribution has been verified separately.
  NX_CLOUD_AUTO_TASK_PACKING: 'false'

jobs:
  record-contracts:
    name: Record contract inputs on Cloud Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare pnpm
        run: corepack enable
      - name: Start three Cloud Workers
        run: pnpm dlx nx-cloud start-workers
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Record real file reads for contract tasks
        run: |
          set -euo pipefail
          mkdir -p reports/ultracache
          # A real Vitest invocation input changes on every attempt. Every test
          # still runs, and Workers receive the same arguments. No cache bypass.
          pnpm exec nx run-many -t test:contract \
            --projects=goal-contracts,task-contracts,goal-workspace-contracts,task-workspace-contracts \
            --args="--reporter=default --reporter=json --outputFile=.tmp-ultracache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            --outputStyle=static 2>&1 | tee reports/ultracache/recording.log
          node tools/ci-cd-platform/verify-ultracache-recording.mjs reports/ultracache/recording.log
      - name: Stop Cloud Workers
        if: always()
        run: pnpm dlx nx-cloud stop-all-workers || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ultracache-recording
          path: reports/ultracache/
          if-no-files-found: warn
          retention-days: 14

  verify-affected:
    needs: record-contracts
    name: Verify recorded inputs in production dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The recording execution pinned its inputs before it recorded them.
      # Resolve the published configurations in a new CI execution context.
      NX_CI_EXECUTION_ID: '${{ github.run_id }}-${{ github.run_attempt }}-acceptance'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --reporter=append-only
      - name: Initialize Cloud context without Workers
        run: pnpm exec nx-cloud start-ci-run --no-distribution
      - name: Compare native selection and production delivery dispatch
        run: node tools/ci-cd-platform/verify-ultracache-affected.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ultracache-affected-acceptance
          path: reports/ultracache/
          if-no-files-found: warn
          retention-days: 14
