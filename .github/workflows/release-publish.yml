name: Release Publish

on:
  workflow_run:
    workflows: ['Publish Main Candidate']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify release evidence without publishing (workflow remains disabled manually)
        type: boolean
        default: true
      tag:
        description: Existing draft tag or intended tag for a verified release-SHA recovery
        required: true
        type: string
      release_sha:
        description: Exact successful-main-CI release merge SHA to recover if the tag was not created
        required: false
        type: string

concurrency:
  group: release-publish-${{ github.event.workflow_run.head_sha || inputs.tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  resolve:
    name: Resolve Release Candidate
    permissions: { contents: read, actions: read, pull-requests: read }
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.contract.outputs.eligible }}
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
      sha: ${{ steps.contract.outputs.sha }}
      ci_run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha || inputs.tag }}
          fetch-depth: 0

      - name: Checkout current release recovery verifier
        if: github.event_name == 'workflow_dispatch' && inputs.release_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-recovery-control
          fetch-depth: 1

      - name: Require exact replay SHA and current main control plane
        if: github.event_name == 'workflow_dispatch' && inputs.release_sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git -C .release-recovery-control rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git show "$GITHUB_SHA:package.json" | jq -r .version)" = "${RELEASE_TAG#v}"
          test "$(git show "$GITHUB_SHA:.release-please-manifest.json" | jq -r '."."')" = "${RELEASE_TAG#v}"

      - name: Resolve release contract
        id: contract
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA_REPLAY: ${{ inputs.release_sha }}
        shell: bash
        run: |
          args=(--github-output)
          contract=./tools/ci-cd-platform/release-tools/release-contract.mjs
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--require-release --expected-tag "$RELEASE_TAG")
            if [ -n "$RELEASE_SHA_REPLAY" ]; then
              contract=./.release-recovery-control/tools/ci-cd-platform/release-tools/release-contract.mjs
            fi
          fi
          node "$contract" "${args[@]}"

      - name: Require release SHA to remain on main
        if: steps.contract.outputs.eligible == 'true'
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main

      - name: Resolve exact successful CI
        if: steps.contract.outputs.eligible == 'true'
        id: ci
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_SHA: ${{ steps.contract.outputs.sha }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            if (context.eventName === 'workflow_run') {
              const candidateRun = context.payload.workflow_run;
              if (
                candidateRun.head_sha !== sha ||
                candidateRun.conclusion !== 'success' ||
                candidateRun.head_branch !== 'main'
              ) {
                core.setFailed(`workflow_run is not successful exact-SHA candidate publication for ${sha}`);
                return;
              }
            }
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              status: 'success',
              per_page: 20,
            });
            const run = response.data.workflow_runs.find(
              (candidate) => candidate.head_sha === sha && candidate.event === 'push' && candidate.head_branch === 'main',
            );
            if (!run) core.setFailed(`No successful exact-SHA main CI run found for ${sha}`);
            else core.setOutput('run_id', String(run.id));

      - uses: ./.github/actions/setup-nx-affected-job
        if: steps.contract.outputs.eligible == 'true'
        with: { node-version: '24', setup-python: 'false', setup-uv: 'false' }
      - name: Verify release test and artifact provenance before mutation
        if: steps.contract.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.contract.outputs.sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node ./tools/ci-cd-platform/verify-ci-promotion.mjs

      - name: No-op summary
        if: steps.contract.outputs.eligible != 'true'
        run: echo "CI completed for a non-release main commit; no release action is required." >> "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Create or Resume Draft Release
    permissions: { contents: write }
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.prepare.outputs.already_published }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Checkout current release recovery verifier for notes
        if: github.event_name == 'workflow_dispatch' && inputs.release_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-recovery-control
          fetch-depth: 1

      - name: Recheck replay control plane before creating the Draft
        if: github.event_name == 'workflow_dispatch' && inputs.release_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA_REPLAY: ${{ inputs.release_sha }}
        shell: bash
        run: |
          contract=./tools/ci-cd-platform/release-tools/release-contract.mjs
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$RELEASE_SHA_REPLAY" ]; then
            contract=./.release-recovery-control/tools/ci-cd-platform/release-tools/release-contract.mjs
          fi
          node "$contract" --require-release --expected-tag "$RELEASE_TAG" --write-notes release-notes.md

      - name: Require dedicated release API credential
        env:
          RELEASE_WRITE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          test -n "$RELEASE_WRITE_TOKEN" || {
            echo 'RELEASE_PLEASE_TOKEN is required to create/publish GitHub Releases' >&2
            exit 1
          }

      - name: Create or validate draft release and tag
        id: prepare
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function resolveTagSha() {
              try {
                const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                let resolved = ref.data.object.sha;
                if (ref.data.object.type === 'tag') {
                  const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: resolved });
                  resolved = annotated.data.object.sha;
                }
                return resolved;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function getRelease() {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              });
              const matches = releases.filter((release) => release.tag_name === tag);
              if (matches.length > 1) {
                const identities = matches.map((release) => `${release.id}:${release.draft ? 'draft' : 'published'}`);
                core.setFailed(`${tag} has ambiguous release records: ${identities.join(', ')}`);
                return { ambiguous: true, release: null };
              }
              return { ambiguous: false, release: matches[0] ?? null };
            }

            const existingTagSha = await resolveTagSha();
            if (existingTagSha && existingTagSha !== sha) {
              core.setFailed(`${tag} already points to ${existingTagSha}, expected ${sha}`);
              return;
            }

            if (!existingTagSha) {
              // Create the immutable ref first. GITHUB_TOKEN-created tag pushes do not
              // recursively start normal push workflows, and a tag-first partial state
              // is directly resumable through workflow_dispatch if release creation fails.
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            }

            const resolvedRelease = await getRelease();
            if (resolvedRelease.ambiguous) return;
            let release = resolvedRelease.release;
            if (release && !release.draft) {
              core.setOutput('already_published', 'true');
              core.setOutput('release_id', String(release.id));
              return;
            }
            if (!release) {
              release = (
                await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  target_commitish: sha,
                  name: tag,
                  body: fs.readFileSync('release-notes.md', 'utf8'),
                  draft: true,
                })
              ).data;
            }
            core.setOutput('already_published', 'false');
            core.setOutput('release_id', String(release.id));

  release-assets:
    name: Desktop Release Lane
    permissions: { contents: write, actions: read, pull-requests: read }
    needs:
      - resolve
      - prepare
    if: needs.prepare.outputs.already_published != 'true'
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      sha: ${{ needs.resolve.outputs.sha }}
      macos_signing_mode: ${{ vars.MACOS_RELEASE_MODE || 'unsigned-pilot' }}
    secrets: inherit

  publish-images:
    name: Docker Release Lane
    permissions: { contents: write, actions: read, pull-requests: read, packages: write }
    needs:
      - resolve
      - prepare
    if: needs.prepare.outputs.already_published != 'true'
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      sha: ${{ needs.resolve.outputs.sha }}
      ci_run_id: ${{ needs.resolve.outputs.ci_run_id }}
    secrets: inherit

  finalize:
    name: Release Postflight & Publish
    permissions: { contents: write, actions: read, pull-requests: write }
    needs:
      - resolve
      - prepare
      - release-assets
      - publish-images
    if: >-
      always() &&
      needs.resolve.outputs.eligible == 'true' &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.already_published != 'true' &&
      needs.release-assets.result == 'success' &&
      needs.publish-images.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

          fetch-depth: 0
      - uses: ./.github/actions/setup-nx-affected-job
        with: { node-version: '24', setup-python: 'false', setup-uv: 'false' }

      - name: Download lane evidence from draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p .release-evidence
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          gh release download "$RELEASE_TAG" --pattern desktop-release-manifest.json --pattern docker-release-manifest.json --pattern candidate-set-v1.json --dir .release-evidence

      - name: Revalidate source chain before public release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.resolve.outputs.sha }}
          CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
          CANDIDATE_MANIFEST: .release-evidence/candidate-set-v1.json
        run: node ./tools/ci-cd-platform/verify-ci-promotion.mjs

      - name: Verify the remote Draft contains every manifest-owned Desktop asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_api_url="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          test -n "$release_api_url"
          gh api "$release_api_url" > .release-evidence/github-release.json
          node ./tools/ci-cd-platform/release-tools/verify-desktop-release-assets.mjs \
            .release-evidence/desktop-release-manifest.json \
            .release-evidence/github-release.json

      - name: Build canonical release manifest
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
        run: |
          node ./tools/ci-cd-platform/release-tools/build-release-manifest.mjs \
            .release-evidence/desktop-release-manifest.json \
            .release-evidence/docker-release-manifest.json \
            .release-evidence/candidate-set-v1.json \
            "$RELEASE_TAG" "$RELEASE_SHA" "$CI_RUN_ID" release-manifest.json

      - name: Upload canonical manifest and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" release-manifest.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Published $RELEASE_TAG after exact-SHA CI, Desktop assets, Docker images, and release evidence all passed." >> "$GITHUB_STEP_SUMMARY"

  reconcile-release-pr:
    name: Mark Release PR Tagged
    needs:
      - resolve
      - prepare
    if: >-
      always() &&
      needs.resolve.outputs.eligible == 'true' &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile release-please labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const sha = process.env.RELEASE_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              base: context.payload.repository.default_branch,
              per_page: 100,
            });
            const releasePr = pulls.find(
              (pull) => pull.merged_at && pull.merge_commit_sha === sha,
            );
            if (!releasePr) {
              core.setFailed(`No merged release PR found for ${sha}`);
              return;
            }

            const labels = releasePr.labels
              .map((label) => (typeof label === 'string' ? label : label.name))
              .filter(Boolean);
            if (!labels.includes('autorelease: tagged')) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: releasePr.number,
                labels: ['autorelease: tagged'],
              });
            }
            if (labels.includes('autorelease: pending')) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: releasePr.number,
                name: 'autorelease: pending',
              });
            }
            core.info(`Marked release PR #${releasePr.number} tagged for ${sha}`);
