name: Promote Nightly to Stable

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      tag:
        type: string
        required: true
      sha:
        type: string
        required: true
      ci_run_id:
        type: string
        required: true
      dry_run:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: Published verified Nightly to promote (not necessarily the newest)
        type: string
        required: true
      dry_run:
        description: Verify selected Nightly without publishing Stable
        type: boolean
        default: true

concurrency:
  group: release-publication-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  resolve:
    name: Resolve immutable release source
    if: github.repository == 'BakerSean168/memoflow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      ci_run_id: ${{ steps.plan.outputs.ci_run_id }}
      channel: ${{ steps.plan.outputs.channel }}
      source_nightly: ${{ steps.plan.outputs.source_nightly }}
      source_nightly_digest: ${{ steps.plan.outputs.source_nightly_digest }}
      runtime_digest: ${{ steps.plan.outputs.runtime_digest }}
    steps:
      - name: Checkout pinned release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Verify selected Nightly or scheduled source
        id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel || 'stable' }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SOURCE_NIGHTLY: ${{ inputs.nightly_tag }}
        with:
          # Draft visibility is needed for idempotent retries. This step remains read-only.
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          script: |
            const lifecycle = require('./tools/ci-cd-platform/lib/release-lifecycle.cjs');
            const channel = process.env.REQUESTED_CHANNEL;
            if (channel === 'stable' && context.eventName !== 'workflow_dispatch') throw new Error('Stable requires explicit operator dispatch');
            if (channel === 'nightly' && !context.workflow.includes('Nightly Release')) throw new Error('Nightly must use its scheduled eligibility controller');
            const plan = await lifecycle.resolveReleasePlan({ github, ...context.repo, channel, tag: process.env.RELEASE_TAG, sha: process.env.RELEASE_SHA, ciRunId: process.env.CI_RUN_ID, nightlyTag: process.env.SOURCE_NIGHTLY });
            lifecycle.output(core, plan);
            await core.summary.addHeading('Release plan').addCodeBlock(JSON.stringify(plan, null, 2), 'json').write();
      - name: Checkout exact release SHA
        if: steps.plan.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.plan.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-nx-affected-job
        if: steps.plan.outputs.eligible == 'true'
        with: { node-version: '24', setup-python: 'false', setup-uv: 'false' }
      - name: Verify source main CI and artifact chain before mutation
        if: steps.plan.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.plan.outputs.sha }}
          CI_RUN_ID: ${{ steps.plan.outputs.ci_run_id }}
        run: node ./tools/ci-cd-platform/verify-ci-promotion.mjs

  prepare:
    name: Create or resume immutable draft
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true' && inputs.dry_run != true
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Require dedicated release API credential
        env:
          RELEASE_WRITE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: test -n "$RELEASE_WRITE_TOKEN"
      - name: Create or validate draft release and tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { ensureDraft } = require('./tools/ci-cd-platform/lib/release-lifecycle.cjs');
            await ensureDraft({ github, ...context.repo, tag: process.env.RELEASE_TAG, sha: process.env.RELEASE_SHA, channel: process.env.RELEASE_CHANNEL });

  build-candidate:
    name: Exact-SHA Nightly images
    needs: [resolve, prepare]
    if: needs.resolve.outputs.channel == 'nightly'
    permissions: { contents: read, actions: read, pull-requests: read, packages: write }
    uses: ./.github/workflows/candidate-publish.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      ci_run_id: ${{ needs.resolve.outputs.ci_run_id }}
      dry_run: false
      promote_staging: false
    secrets: inherit

  release-quality:
    name: Exact-source release acceptance
    needs: [resolve, prepare]
    permissions: { contents: read, actions: read }
    uses: ./.github/workflows/release-quality.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  release-assets:
    name: Desktop native acceptance and packaging
    needs: [resolve, prepare]
    permissions: { contents: write, actions: read, pull-requests: read }
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      sha: ${{ needs.resolve.outputs.sha }}
      channel: ${{ needs.resolve.outputs.channel }}
      macos_signing_mode: ${{ vars.MACOS_RELEASE_MODE || 'unsigned-pilot' }}
    secrets: inherit

  publish-images:
    name: Digest-preserving image tags
    needs: [resolve, prepare, build-candidate]
    if: >-
      always() && needs.prepare.result == 'success' &&
      ((needs.resolve.outputs.channel == 'nightly' && needs.build-candidate.result == 'success') ||
       (needs.resolve.outputs.channel == 'stable' && needs.build-candidate.result == 'skipped'))
    permissions: { contents: write, actions: read, pull-requests: read, packages: write }
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      sha: ${{ needs.resolve.outputs.sha }}
      ci_run_id: ${{ needs.resolve.outputs.ci_run_id }}
      channel: ${{ needs.resolve.outputs.channel }}
      source_nightly: ${{ needs.resolve.outputs.source_nightly }}
    secrets: inherit

  finalize:
    name: Verify all release evidence and publish
    needs: [resolve, prepare, build-candidate, release-assets, publish-images, release-quality]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.release-assets.result == 'success' && needs.publish-images.result == 'success' &&
      needs.release-quality.result == 'success'
    permissions: { contents: write, actions: read, pull-requests: read }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-nx-affected-job
        with: { node-version: '24', setup-python: 'false', setup-uv: 'false' }
      - name: Download lane evidence from draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .release-evidence
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --pattern desktop-release-manifest.json --pattern docker-release-manifest.json --pattern candidate-set-v1.json --dir .release-evidence
      - name: Revalidate source chain before public release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.resolve.outputs.sha }}
          CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
          CANDIDATE_MANIFEST: .release-evidence/candidate-set-v1.json
        run: node ./tools/ci-cd-platform/verify-ci-promotion.mjs
      - name: Verify the remote Draft contains every manifest-owned Desktop asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          release_api_url="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          test -n "$release_api_url"
          gh api "$release_api_url" > .release-evidence/github-release.json
          node ./tools/ci-cd-platform/release-tools/verify-desktop-release-assets.mjs .release-evidence/desktop-release-manifest.json .release-evidence/github-release.json
      - name: Download exact-source release acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-quality-receipt
          path: .release-evidence
      - name: Build canonical release manifest and Nightly source receipt
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          SOURCE_NIGHTLY: ${{ needs.resolve.outputs.source_nightly }}
          SOURCE_NIGHTLY_DIGEST: ${{ needs.resolve.outputs.source_nightly_digest }}
          NIGHTLY_RUNTIME_DIGEST: ${{ needs.build-candidate.outputs.runtime_digest || needs.resolve.outputs.runtime_digest }}
        run: |
          node ./tools/ci-cd-platform/release-tools/build-release-manifest.mjs .release-evidence/desktop-release-manifest.json .release-evidence/docker-release-manifest.json .release-evidence/candidate-set-v1.json "$RELEASE_TAG" "$RELEASE_SHA" "$CI_RUN_ID" release-manifest.json
          node ./tools/ci-cd-platform/release-tools/finalize-release-channel.mjs release-manifest.json .release-evidence
      - name: Upload canonical manifest and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-manifest.json --clobber
          if [ "$RELEASE_CHANNEL" = nightly ]; then
            gh release upload "$RELEASE_TAG" nightly-manifest.json --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
          echo "Published $RELEASE_TAG with exact-SHA CI, native and image evidence; no Production deployment." >> "$GITHUB_STEP_SUMMARY"

  reconcile-release-pr:
    name: Reconcile successful Stable publication
    needs: [resolve, finalize]
    if: needs.resolve.outputs.channel == 'stable' && needs.finalize.result == 'success'
    permissions: { contents: read, pull-requests: write, issues: write }
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile release-please labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'closed', base: 'main', per_page: 100 });
            const expectedTitle = `chore(main): release ${process.env.RELEASE_VERSION}`;
            const matches = pulls.filter(p => p.merged_at && p.title === expectedTitle);
            if (matches.length > 1) throw new Error('ambiguous Release Please milestone');
            const releasePr = matches[0];
            if (!releasePr) { core.notice('No pending Release Please PR for this already-versioned source'); return; }
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${releasePr.merge_commit_sha}...${process.env.RELEASE_SHA}` })).data;
            if (!['ahead', 'identical'].includes(comparison.status)) throw new Error('Release Please milestone is not in selected Nightly source');
            await github.rest.issues.addLabels({ ...context.repo, issue_number: releasePr.number, labels: ['autorelease: tagged'] });
            if (releasePr.labels.some(l => (typeof l === 'string' ? l : l.name) === 'autorelease: pending')) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: releasePr.number, name: 'autorelease: pending' });
            }
