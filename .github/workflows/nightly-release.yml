name: Nightly Release Eligibility

# Eligibility preflight only. The publishing lane is intentionally not enabled
# until the full Nightly -> Stable release migration is validated end to end.
on:
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:

concurrency:
  # Schedule and manual recovery may never race or silently cancel an active check.
  group: memoflow-nightly-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    name: Nightly Release Eligibility
    if: github.repository == 'BakerSean168/memoflow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      ci_run_id: ${{ steps.check.outputs.ci_run_id }}
      nightly_tag: ${{ steps.check.outputs.nightly_tag }}
    steps:
      - name: Checkout only Nightly eligibility logic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tools/ci-cd-platform/lib

      - name: Evaluate exact-SHA main CI and Nightly gap
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { resolveNightlyEligibility } = require('./tools/ci-cd-platform/lib/nightly-eligibility.cjs');
            const result = await resolveNightlyEligibility({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              runNumber: Number(process.env.GITHUB_RUN_NUMBER),
            });
            core.setOutput('eligible', String(result.eligible));
            core.setOutput('source_sha', result.mainSha ?? '');
            core.setOutput('ci_run_id', String(result.ciRunId ?? ''));
            core.setOutput('nightly_tag', result.nightlyTag ?? '');
            core.summary
              .addHeading('Nightly release eligibility')
              .addRaw('Decision: ' + (result.eligible ? 'ELIGIBLE' : 'SKIP') + '\n')
              .addRaw('Reason: ' + result.reason + '\n')
              .addRaw('Main SHA: ' + (result.mainSha ?? 'unknown') + '\n')
              .addRaw('Matching CI run: ' + (result.ciRunId ?? 'none') + '\n')
              .addRaw('Next release tag: ' + (result.nightlyTag ?? 'none') + '\n')
              .addRaw('\nThis workflow does not build or publish releases yet. See Issue #628.\n');
            await core.summary.write();
            if (result.eligible) {
              core.notice('Nightly eligible: ' + result.nightlyTag + ' (' + result.mainSha + ')');
            } else {
              core.info('Skipping Nightly: ' + result.reason);
            }
