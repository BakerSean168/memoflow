name: Coverage

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  CI: 'true'
  NODE_ENV: test
  # Coverage imports Prisma-backed adapters; tests replace persistence with fixtures.
  DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5433/memoflow_test
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  DELIVERY_MANIFEST_PATH: scope/delivery-manifest-v1.json
  GOVERNED_COVERAGE_PROJECTS: 'account,ai,app-vue,domain-shared,goal,notification,reminder,schedule,setting,task'

jobs:
  coverage:
    name: Coverage Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}
          setup-python: 'false'
          setup-uv: 'false'
          lane: coverage

      - name: Generate full or affected delivery manifest
        env:
          NX_BASE: ${{ github.event.before }}
          NX_HEAD: ${{ github.sha }}
          DELIVERY_FORCE_LANES: coverage
          DELIVERY_MANIFEST_OUTPUT: scope/delivery-manifest-v1.json
        run: node ./tools/ci-cd-platform/generate-delivery-manifest.mjs
      - name: Validate delivery manifest
        run: node ./tools/ci-cd-platform/validate-manifest.mjs scope/delivery-manifest-v1.json delivery
      - name: Create coverage lane input contract
        env:
          DELIVERY_LANE: coverage
          DELIVERY_MANIFEST_PATH: scope/delivery-manifest-v1.json
          LANE_INPUT_OUTPUT: reports/ci-cd-platform/coverage-input-v1.json
        run: |
          node ./tools/ci-cd-platform/create-lane-input.mjs \
            --lane "$DELIVERY_LANE" \
            --manifest "$DELIVERY_MANIFEST_PATH" \
            --output "$LANE_INPUT_OUTPUT"
          echo "LANE_INPUT_PATH=$LANE_INPUT_OUTPUT" >> "$GITHUB_ENV"

      - name: Detect coverage targets
        id: detect-coverage
        shell: bash
        run: |
          set -euo pipefail
          target_projects="$(pnpm exec nx show projects --with-target=test:coverage)"
          allowed=",${GOVERNED_COVERAGE_PROJECTS},"
          selected_projects=""

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Using affected project detection for push coverage."
            project_source="$(node -e "const m=require('./scope/delivery-manifest-v1.json'); console.log((m.scope.projects || []).join('\\n'))")"
          else
            echo "Using full configured project lists for scheduled/manual coverage."
            project_source="$(printf '%s\n' ${GOVERNED_COVERAGE_PROJECTS//,/ })"
          fi

          while IFS= read -r project; do
            [ -z "$project" ] && continue
            [[ "$allowed" == *",$project,"* ]] || continue
            grep -Fxq "$project" <<< "$target_projects" || continue
            echo "Selected $project for test:coverage"
            if [ -z "$selected_projects" ]; then
              selected_projects="$project"
            else
              selected_projects="$selected_projects,$project"
            fi
          done <<< "$project_source"

          if [ "${{ github.event_name }}" != "push" ] && [ -z "$selected_projects" ]; then
            echo "Full coverage audit selected no configured targets; refusing a false-green run."
            exit 1
          fi

          echo "has_target=$([ -n "$selected_projects" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "projects=$selected_projects" >> "$GITHUB_OUTPUT"

      - name: Record no coverage targets selected
        if: steps.detect-coverage.outputs.has_target != 'true'
        env:
          DELIVERY_LANE: coverage
          TEST_REPORT_NAME: coverage-no-targets
        run: >-
          node ./tools/test-system-v2/run-command.mjs -- node -e
          "console.log('No governed coverage targets selected for this push.')"

      - name: Run governed coverage gates
        if: steps.detect-coverage.outputs.has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
          DELIVERY_LANE: coverage
          TEST_REPORT_NAME: coverage
        run: node ./tools/test-system-v2/run-command.mjs -- pnpm exec nx run-many -t test:coverage --projects="${{ steps.detect-coverage.outputs.projects }}" --parallel=2 --outputStyle=static
      - uses: ./.github/actions/publish-lane-evidence
        with: { lane: coverage }
