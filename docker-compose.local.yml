#
# =============================================================================
# MemoFlow 本地 Docker 编排（完整 prod-like 本地模式）
# =============================================================================
# 用法：
#   pnpm docker:local:up
#
# 设计目标：
#   - 单文件启动，不再叠加 prod/local/local-test 多层 compose
#   - 尽量保持与生产拓扑一致：postgres + redis + api + powersync + web
#   - 使用本地构建镜像，便于修改代码后快速验证
#   - 不引入 caddy/watchtower，改为直接暴露调试端口
#
# 本地访问入口：
#   - Web:       http://localhost:20200
#   - API:       http://localhost:20201
#   - PowerSync: http://localhost:20202
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-20210}:5432'
    volumes:
      - postgres-local-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    networks:
      - memoflow-local-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:?set DB_USER} -d ${DB_NAME:?set DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-20211}:6379'
    volumes:
      - redis-local-data:/data
    networks:
      - memoflow-local-network
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
          '--no-auth-warning',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrator:
    image: memoflow-migrator:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrator-runtime
      args:
        VERSION: local
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmmirror.com}
      labels:
        org.opencontainers.image.created: ${BUILD_DATE:-unknown}
        org.opencontainers.image.revision: ${VCS_REF:-unknown}
    restart: 'no'
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # 本地验证环境（空库）：允许 db push 接受 data-loss 警告（唯一约束重建）。
      MIGRATOR_ACCEPT_DATA_LOSS: ${MIGRATOR_ACCEPT_DATA_LOSS:-1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    networks:
      - memoflow-local-network

  api:
    image: memoflow-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.api
      target: api-runtime
      args:
        VERSION: local
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmmirror.com}
      labels:
        org.opencontainers.image.created: ${BUILD_DATE:-unknown}
        org.opencontainers.image.revision: ${VCS_REF:-unknown}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Local Docker only: open console email-code capture endpoint for register→verify flows
      # without production mail. Must not appear in release/production compose.
      LOCAL_VALIDATION: ${LOCAL_VALIDATION:-1}
      # Optional real SMTP (from .env.production.local). Default console when unset.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      APP_NAME: ${APP_NAME:-MemoFlow}
      APP_VERSION: ${APP_VERSION:-0.3.0}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-memoflow-api}
      API_PORT: 3000
      API_HOST: 0.0.0.0
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:20201/api/auth}
      MEMOFLOW_WEB_URL: ${MEMOFLOW_WEB_URL:-http://localhost:20200}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_INSTALLATION_ROUTE_KEY: ${GITHUB_INSTALLATION_ROUTE_KEY:-}
      GITHUB_INSTALLATION_ROUTE_TARGETS: ${GITHUB_INSTALLATION_ROUTE_TARGETS:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${LOCAL_DOCKER_CORS_ORIGIN:-http://localhost:20200,http://127.0.0.1:20200,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:20201,http://127.0.0.1:20201}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-10485760}
      ENABLE_DAILY_ANALYSIS: ${ENABLE_DAILY_ANALYSIS:-true}
      USE_PRIORITY_QUEUE_SCHEDULER: ${USE_PRIORITY_QUEUE_SCHEDULER:-true}
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY:?set AI_PROVIDER_ENCRYPTION_KEY}
      AI_PROVIDER_ENCRYPTION_KEY_ID: ${AI_PROVIDER_ENCRYPTION_KEY_ID:-primary}
      AI_PROVIDER_ENCRYPTION_PREVIOUS_KEYS: ${AI_PROVIDER_ENCRYPTION_PREVIOUS_KEYS:-}
      AI_PROVIDER_PRIVATE_ENDPOINT_ALLOWLIST: ${AI_PROVIDER_PRIVATE_ENDPOINT_ALLOWLIST:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      QI_NIU_YUN_API_KEY: ${QI_NIU_YUN_API_KEY:-}
      QI_NIU_YUN_BASE_URL: ${QI_NIU_YUN_BASE_URL:-}
      QI_NIU_YUN_MODEL_ID: ${QI_NIU_YUN_MODEL_ID:-}
      POWERSYNC_URL: ${POWERSYNC_URL:?set POWERSYNC_URL}
      POWERSYNC_PRIVATE_KEY: ${POWERSYNC_PRIVATE_KEY:?set POWERSYNC_PRIVATE_KEY}
      POWERSYNC_PUBLIC_KEY_N: ${POWERSYNC_PUBLIC_KEY_N:?set POWERSYNC_PUBLIC_KEY_N}
      POWERSYNC_PUBLIC_KEY_E: ${POWERSYNC_PUBLIC_KEY_E:-AQAB}
      POWERSYNC_KEY_ID: ${POWERSYNC_KEY_ID:?set POWERSYNC_KEY_ID}
      POWERSYNC_SNAPSHOT_DIR: ${POWERSYNC_SNAPSHOT_DIR:-/var/lib/memoflow/powersync-snapshots}
      SNAPSHOT_REBUILD_ENABLED: ${SNAPSHOT_REBUILD_ENABLED:-false}
      SNAPSHOT_REBUILD_SCHEDULE: '${SNAPSHOT_REBUILD_SCHEDULE:-0 */4 * * *}'
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '${LOCAL_DOCKER_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-20201}:3000'
    volumes:
      - api-local-logs:/app/apps/api/logs
      - api-local-uploads:/app/uploads
      - repository-local-storage:/tmp/memoflow-repository-storage
      - powersync-profile-snapshots-local:${POWERSYNC_SNAPSHOT_DIR:-/var/lib/memoflow/powersync-snapshots}
    networks:
      - memoflow-local-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:http').get('http://127.0.0.1:3000/healthz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  powersync:
    image: memoflow-powersync:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/powersync/Dockerfile.bake
      args:
        VERSION: local
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmmirror.com}
      labels:
        org.opencontainers.image.created: ${BUILD_DATE:-unknown}
        org.opencontainers.image.revision: ${VCS_REF:-unknown}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ['start', '-c', '/config/powersync.yaml']
    environment:
      POWERSYNC_PORT: ${POWERSYNC_PORT:-8080}
      PS_PORT: ${POWERSYNC_PORT:-8080}
      PS_SOURCE_HOSTNAME: postgres
      PS_SOURCE_PORT: 5432
      PS_SOURCE_DATABASE: ${DB_NAME:?set DB_NAME}
      PS_SOURCE_USERNAME: ${DB_USER:?set DB_USER}
      PS_SOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      PS_STORAGE_HOSTNAME: postgres
      PS_STORAGE_PORT: 5432
      PS_STORAGE_DATABASE: ${DB_NAME:?set DB_NAME}
      PS_STORAGE_USERNAME: ${DB_USER:?set DB_USER}
      PS_STORAGE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      PS_JWK_N: ${POWERSYNC_PUBLIC_KEY_N:?set POWERSYNC_PUBLIC_KEY_N}
      PS_JWK_E: ${POWERSYNC_PUBLIC_KEY_E:-AQAB}
      PS_JWK_KID: ${POWERSYNC_KEY_ID:?set POWERSYNC_KEY_ID}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '${LOCAL_DOCKER_BIND_HOST:-127.0.0.1}:${POWERSYNC_HOST_PORT:-20202}:${POWERSYNC_PORT:-8080}'
    networks:
      - memoflow-local-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const port = process.env.POWERSYNC_PORT || '8080'; const http = require('http'); const req = http.get('http://127.0.0.1:' + port + '/probes/liveness', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: memoflow-web:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VERSION: local
      labels:
        org.opencontainers.image.created: ${BUILD_DATE:-unknown}
        org.opencontainers.image.revision: ${VCS_REF:-unknown}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${LOCAL_DOCKER_BIND_HOST:-127.0.0.1}:${WEB_HOST_PORT:-20200}:80'
    networks:
      - memoflow-local-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  memoflow-local-network:
    driver: bridge

volumes:
  postgres-local-data:
  redis-local-data:
  api-local-logs:
  api-local-uploads:
  repository-local-storage:
  powersync-profile-snapshots-local:
