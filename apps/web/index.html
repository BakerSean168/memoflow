<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181A1F" />
    <meta name="description" content="知行（MemoFlow），将知识转化为行动的流式个人工作台。" />
    <style>
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
        color-scheme: light dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }

      .startup-splash__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
      }

      .startup-splash__mark {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 10px 24px rgba(244, 170, 36, 0.28));
      }

      .startup-splash__title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .startup-splash__subtitle {
        font-size: 12px;
        opacity: 0.72;
      }

      .startup-splash__bar {
        width: 160px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(127 127 127 / 0.18);
      }

      .startup-splash__bar::before {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgb(244 170 36 / 0.95), transparent);
        animation: startup-splash-slide 1.15s infinite;
      }

      @media (prefers-color-scheme: light) {
        .startup-splash__mark {
          filter: drop-shadow(0 10px 24px rgba(217, 119, 6, 0.22));
        }

        .startup-splash__bar::before {
          background: linear-gradient(90deg, transparent, rgb(217 119 6 / 0.95), transparent);
        }
      }

      @keyframes startup-splash-slide {
        from {
          transform: translateX(-120%);
        }

        to {
          transform: translateX(260%);
        }
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>知行 MemoFlow</title>
  </head>
  <body>
    <div id="app">
      <div id="startup-splash" aria-live="polite" aria-label="应用正在加载">
        <div class="startup-splash__card">
          <img
            class="startup-splash__mark"
            src="/assets/logos/MemoFlow-128.png"
            alt="知行 MemoFlow"
            width="52"
            height="52"
            aria-hidden="true"
          />
          <div class="startup-splash__title">知行 MemoFlow</div>
          <div class="startup-splash__subtitle">正在进入工作区...</div>
          <div class="startup-splash__bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
